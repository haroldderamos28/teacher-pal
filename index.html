<body>

<div class="container">

  <h1>Teacher Pal</h1>

  <div class="controls">

    <div class="control-row">

      <label>
        Mode:
        <select id="mode">
          <option value="accurate">Accurate</option>
          <option value="natural" selected>Natural</option>
          <option value="casual">Casual</option>
          <option value="business">Business</option>
          <option value="professional">Professional</option>
          <option value="concise">Concise</option>
          <option value="student">Student-friendly</option>
        </select>
      </label>

      <label>
        Level:
        <select id="level">
          <option value="basic">Basic</option>
          <option value="intermediate" selected>Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </label>

      <label>
        Student language:
        <select id="language">
          <option value="ja" selected>Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh">Chinese</option>
          <option value="vi">Vietnamese</option>
          <option value="th">Thai</option>
          <option value="id">Indonesian</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </label>

      <button id="startBtn">
        Start Listening
      </button>

      <button id="stopBtn" disabled>
        Stop
      </button>

    </div>

    <div class="status" id="status">
      Ready.
    </div>

  </div>

  <div class="coach-grid">

    <!-- LIVE STREAM -->

    <div class="panel">

      <div class="panel-header">
        Live Stream
      </div>

      <div class="panel-body">

        <div id="liveTranscript">
          <div class="empty">
            Start listening and speak normally.
          </div>
        </div>

      </div>

    </div>

    <!-- CORRECTIONS -->

    <div class="panel">

      <div class="panel-header">
        Corrections
      </div>

      <div class="panel-body" id="results">

        <div class="empty">
          Corrections will appear here.
        </div>

      </div>

    </div>

  </div>

</div>

<script>

const WORKER =
  "https://blue-base-6bdc.haroldderamos28.workers.dev";

const DEEPGRAM_LANGUAGE = "en-US";

let socket = null;
let recorder = null;
let stream = null;

let running = false;

let finalTranscript = "";

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const statusEl =
  document.getElementById("status");

const liveTranscript =
  document.getElementById("liveTranscript");

const results =
  document.getElementById("results");

const modeEl =
  document.getElementById("mode");

const levelEl =
  document.getElementById("level");

const languageEl =
  document.getElementById("language");


/*
 * ----------------------------------------
 * STATUS
 * ----------------------------------------
 */

function setStatus(message) {
  statusEl.textContent = message;
}


/*
 * ----------------------------------------
 * START
 * ----------------------------------------
 */

startBtn.addEventListener("click", startListening);

async function startListening() {

  if (running) return;

  try {

    setStatus("Requesting microphone...");

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    setStatus("Connecting to Deepgram...");

    const tokenResponse =
      await fetch(`${WORKER}/token`, {
        method: "POST"
      });

    if (!tokenResponse.ok) {
      throw new Error(
        "Could not obtain Deepgram token."
      );
    }

    const tokenData =
      await tokenResponse.json();

    if (!tokenData.token) {
      throw new Error(
        "Deepgram token was not returned."
      );
    }

    /*
     * Low-latency Deepgram settings.
     */

    const deepgramUrl =
      "wss://api.deepgram.com/v1/listen" +
      "?model=nova-3" +
      "&language=" +
      encodeURIComponent(DEEPGRAM_LANGUAGE) +
      "&smart_format=true" +
      "&interim_results=true" +
      "&endpointing=300" +
      "&utterance_end_ms=1000";

    socket =
      new WebSocket(
        deepgramUrl,
        [
          "bearer",
          tokenData.token
        ]
      );

    socket.onopen = () => {

      running = true;

      startBtn.disabled = true;
      stopBtn.disabled = false;

      setStatus(
        "Listening..."
      );

      startRecorder();
    };


    socket.onmessage = async (event) => {

      try {

        const data =
          JSON.parse(event.data);

        const transcript =
          data.channel?.alternatives?.[0]?.transcript || "";

        if (!transcript.trim()) {
          return;
        }

        /*
         * FINAL RESULT
         */

        if (data.is_final) {

          finalTranscript =
            `${finalTranscript} ${transcript}`.trim();

          renderLiveTranscript(
            finalTranscript,
            ""
          );

        } else {

          /*
           * INTERIM RESULT
           */

          renderLiveTranscript(
            finalTranscript,
            transcript
          );
        }


        /*
         * Only analyze speech_final.
         *
         * This prevents sending every interim
         * transcript to the AI.
         */

        if (data.speech_final) {

          const sentence =
            transcript.trim();

          if (sentence.length >= 2) {

            analyzeSentence(sentence);
          }

          /*
           * Clear the accumulated phrase after
           * sending it to the correction engine.
           */

          finalTranscript = "";
        }

      } catch (error) {

        console.error(
          "Deepgram message error:",
          error
        );
      }

    };


    socket.onerror = (event) => {

      console.error(
        "Deepgram WebSocket error:",
        event
      );

      setStatus(
        "Voice engine error."
      );
    };


    socket.onclose = (event) => {

      console.log(
        "Deepgram closed:",
        event.code,
        event.reason
      );

      if (running) {

        setStatus(
          `Voice engine disconnected (${event.code}).`
        );
      }
    };


  } catch (error) {

    console.error(error);

    setStatus(
      error.message ||
      "Could not start listening."
    );

    cleanup();
  }
}


/*
 * ----------------------------------------
 * RECORDER
 * ----------------------------------------
 */

function startRecorder() {

  if (!stream || !socket) return;

  let mimeType =
    "audio/webm;codecs=opus";

  if (!MediaRecorder.isTypeSupported(mimeType)) {

    mimeType =
      "audio/webm";
  }

  recorder =
    new MediaRecorder(
      stream,
      {
        mimeType
      }
    );

  recorder.ondataavailable =
    async (event) => {

      if (
        event.data.size > 0 &&
        socket &&
        socket.readyState === WebSocket.OPEN
      ) {

        socket.send(event.data);
      }
    };

  recorder.start(100);
}


/*
 * ----------------------------------------
 * LIVE TRANSCRIPT
 * ----------------------------------------
 */

function renderLiveTranscript(
  finalText,
  interimText
) {

  const safeFinal =
    escapeHtml(finalText);

  const safeInterim =
    escapeHtml(interimText);

  liveTranscript.innerHTML = `
    <div class="final-line">
      ${safeFinal}
    </div>

    <div class="interim">
      ${safeInterim}
    </div>
  `;
}


/*
 * ----------------------------------------
 * AI ANALYSIS
 * ----------------------------------------
 */

async function analyzeSentence(text) {

  const card =
    document.createElement("div");

  card.className =
    "correction-card";

  card.innerHTML = `
    <div class="thinking">
      Analyzing...
    </div>
  `;

  /*
   * Put newest correction at the top.
   */

  if (
    results.children.length === 1 &&
    results.firstElementChild.classList.contains("empty")
  ) {

    results.innerHTML = "";
  }

  results.prepend(card);

  try {

    const response =
      await fetch(WORKER, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          text,

          mode:
            modeEl.value,

          level:
            levelEl.value,

          language:
            languageEl.value

        })

      });

    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `AI error ${response.status}: ${errorText}`
      );
    }

    /*
     * Workers AI streams SSE.
     */

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder();

    let buffer = "";
    let generated = "";

    while (true) {

      const {
        value,
        done
      } =
        await reader.read();

      if (done) break;

      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );

      const events =
        buffer.split("\n\n");

      buffer =
        events.pop() || "";

      for (
        const event of events
      ) {

        const lines =
          event.split("\n");

        for (
          const line of lines
        ) {

          if (
            !line.startsWith("data:")
          ) {
            continue;
          }

          const payload =
            line.slice(5).trim();

          if (
            !payload ||
            payload === "[DONE]"
          ) {
            continue;
          }

          try {

            const parsed =
              JSON.parse(payload);

            /*
             * Workers AI normally returns
             * generated text in "response".
             */

            if (
              typeof parsed.response === "string"
            ) {

              generated +=
                parsed.response;

            }

          } catch {
            /*
             * Ignore incomplete SSE chunks.
             */
          }

        }
      }
    }

    /*
     * Some responses may have a final
     * unprocessed buffer.
     */

    if (buffer) {

      const lines =
        buffer.split("\n");

      for (
        const line of lines
      ) {

        if (
          !line.startsWith("data:")
        ) {
          continue;
        }

        const payload =
          line.slice(5).trim();

        if (
          !payload ||
          payload === "[DONE]"
        ) {
          continue;
        }

        try {

          const parsed =
            JSON.parse(payload);

          if (
            typeof parsed.response === "string"
          ) {

            generated +=
              parsed.response;
          }

        } catch {}
      }
    }

    renderCorrection(
      card,
      generated
    );

  } catch (error) {

    console.error(
      "Analysis error:",
      error
    );

    card.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}


/*
 * ----------------------------------------
 * CORRECTION DISPLAY
 * ----------------------------------------
 */

function renderCorrection(
  card,
  generated
) {

  const corrected =
    extractLine(
      generated,
      "CORRECTED:"
    );

  const natural =
    extractLine(
      generated,
      "NATURAL:"
    );

  const why =
    extractLine(
      generated,
      "WHY:"
    );

  /*
   * Fallback if the model doesn't
   * perfectly follow the format.
   */

  if (!corrected && !natural && !why) {

    card.innerHTML = `
      <div class="correction-label">
        Correction
      </div>

      <div class="natural">
        ${escapeHtml(generated.trim())}
      </div>
    `;

    return;
  }

  card.innerHTML = `
    ${
      corrected
        ? `
          <div class="correction-label">
            Corrected
          </div>

          <div class="corrected">
            ${escapeHtml(corrected)}
          </div>
        `
        : ""
    }

    ${
      natural
        ? `
          <div class="correction-label" style="margin-top:12px;">
            More natural
          </div>

          <div class="natural">
            ${escapeHtml(natural)}
          </div>
        `
        : ""
    }

    ${
      why
        ? `
          <div class="why">
            ${escapeHtml(why)}
          </div>
        `
        : ""
    }
  `;
}


function extractLine(
  text,
  label
) {

  const index =
    text.indexOf(label);

  if (index === -1) {
    return "";
  }

  let value =
    text.slice(
      index + label.length
    );

  /*
   * Stop at the next known label.
   */

  const nextLabels = [
    "CORRECTED:",
    "NATURAL:",
    "WHY:"
  ];

  for (
    const next of nextLabels
  ) {

    if (next === label) {
      continue;
    }

    const nextIndex =
      value.indexOf(next);

    if (nextIndex !== -1) {

      value =
        value.slice(
          0,
          nextIndex
        );
    }
  }

  return value
    .replace(/\n/g, " ")
    .trim();
}


/*
 * ----------------------------------------
 * STOP
 * ----------------------------------------
 */

stopBtn.addEventListener(
  "click",
  stopListening
);

function stopListening() {

  running = false;

  if (recorder) {

    try {
      recorder.stop();
    } catch {}
  }

  if (socket) {

    try {
      socket.close();
    } catch {}
  }

  cleanup();

  setStatus(
    "Stopped."
  );
}


/*
 * ----------------------------------------
 * CLEANUP
 * ----------------------------------------
 */

function cleanup() {

  running = false;

  startBtn.disabled = false;
  stopBtn.disabled = true;

  if (recorder) {

    try {
      recorder.stop();
    } catch {}

    recorder = null;
  }

  if (socket) {

    try {
      socket.close();
    } catch {}

    socket = null;
  }

  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;
  }
}


/*
 * ----------------------------------------
 * HTML ESCAPING
 * ----------------------------------------
 */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
