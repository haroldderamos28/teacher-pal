<script>


/* =====================================
   CONFIGURATION
===================================== */

const WORKER =
  "https://blue-base-6bdc.haroldderamos28.workers.dev";


/*
 * IMPORTANT:
 *
 * The student is learning English.
 *
 * Therefore Deepgram ALWAYS listens
 * for English.
 */

const DEEPGRAM_LANGUAGE =
  "en-US";


/* =====================================
   STATE
===================================== */

let socket = null;

let recorder = null;

let stream = null;

let running = false;

let finalTranscript = "";


/* =====================================
   ELEMENTS
===================================== */

const startBtn =
  document.getElementById(
    "startBtn"
  );

const stopBtn =
  document.getElementById(
    "stopBtn"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const liveTranscript =
  document.getElementById(
    "liveTranscript"
  );

const results =
  document.getElementById(
    "results"
  );

const modeEl =
  document.getElementById(
    "mode"
  );

const levelEl =
  document.getElementById(
    "level"
  );

const languageEl =
  document.getElementById(
    "language"
  );


/* =====================================
   STATUS
===================================== */

function setStatus(
  message
) {

  statusEl.textContent =
    message;
}


/* =====================================
   START LISTENING
===================================== */

startBtn.addEventListener(
  "click",
  startListening
);


async function startListening() {

  if (running) {
    return;
  }


  try {

    setStatus(
      "Requesting microphone..."
    );


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });


    setStatus(
      "Connecting to Deepgram..."
    );


    const tokenResponse =
      await fetch(
        `${WORKER}/token`,
        {
          method: "POST"
        }
      );


    if (!tokenResponse.ok) {

      const errorText =
        await tokenResponse.text();

      throw new Error(
        `Deepgram token error: ${errorText}`
      );
    }


    const tokenData =
      await tokenResponse.json();


    if (!tokenData.token) {

      throw new Error(
        "Deepgram token was not returned."
      );
    }


    /*
     * Low-latency Deepgram configuration.
     */

    const deepgramUrl =
      "wss://api.deepgram.com/v1/listen" +

      "?model=nova-3" +

      "&language=" +
      encodeURIComponent(
        DEEPGRAM_LANGUAGE
      ) +

      "&smart_format=true" +

      "&interim_results=true" +

      "&endpointing=300" +

      "&utterance_end_ms=1000";


    socket =
      new WebSocket(
        deepgramUrl,
        [
          "bearer",
          tokenData.token
        ]
      );


    socket.onopen =
      function () {

        running =
          true;


        startBtn.disabled =
          true;

        stopBtn.disabled =
          false;


        setStatus(
          "Listening..."
        );


        startRecorder();
      };


    socket.onmessage =
      function (event) {

        try {

          const data =
            JSON.parse(
              event.data
            );


          const transcript =
            data
              .channel
              ?.alternatives
              ?.[0]
              ?.transcript
              || "";


          if (!transcript.trim()) {
            return;
          }


          /*
           * FINAL RESULT
           */

          if (data.is_final) {

            finalTranscript =
              (
                finalTranscript +
                " " +
                transcript
              ).trim();


            renderLiveTranscript(
              finalTranscript,
              ""
            );
          }


          /*
           * INTERIM RESULT
           */

          else {

            renderLiveTranscript(
              finalTranscript,
              transcript
            );
          }


          /*
           * Send only completed
           * speech segments to AI.
           */

          if (
            data.speech_final
          ) {

            const sentence =
              transcript.trim();


            if (
              sentence.length >= 2
            ) {

              analyzeSentence(
                sentence
              );
            }


            finalTranscript =
              "";
          }

        }

        catch (error) {

          console.error(
            "Deepgram message error:",
            error
          );
        }

      };


    socket.onerror =
      function (event) {

        console.error(
          "Deepgram WebSocket error:",
          event
        );


        setStatus(
          "Voice engine error."
        );
      };


    socket.onclose =
      function (event) {

        console.log(
          "Deepgram closed:",
          event.code,
          event.reason
        );


        if (running) {

          setStatus(
            `Voice engine disconnected (${event.code}).`
          );
        }
      };


  }

  catch (error) {

    console.error(
      error
    );


    setStatus(
      error.message ||
      "Could not start listening."
    );


    cleanup();
  }

}


/* =====================================
   AUDIO RECORDER
===================================== */

function startRecorder() {

  if (
    !stream ||
    !socket
  ) {

    return;
  }


  let mimeType =
    "audio/webm;codecs=opus";


  if (
    !MediaRecorder
      .isTypeSupported(
        mimeType
      )
  ) {

    mimeType =
      "audio/webm";
  }


  recorder =
    new MediaRecorder(
      stream,
      {
        mimeType:
          mimeType
      }
    );


  recorder.ondataavailable =
    function (event) {

      if (
        event.data.size > 0 &&
        socket &&
        socket.readyState ===
          WebSocket.OPEN
      ) {

        socket.send(
          event.data
        );
      }

    };


  /*
   * Send audio every 100 ms.
   */

  recorder.start(
    100
  );
}


/* =====================================
   LIVE TRANSCRIPT
===================================== */

function renderLiveTranscript(
  finalText,
  interimText
) {

  liveTranscript.innerHTML = `

    <div class="final-line">
      ${escapeHtml(
        finalText
      )}
    </div>

    <div class="interim">
      ${escapeHtml(
        interimText
      )}
    </div>

  `;
}


/* =====================================
   AI ANALYSIS
===================================== */

async function analyzeSentence(
  text
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "correction-card";


  card.innerHTML = `
    <div class="thinking">
      Analyzing...
    </div>
  `;


  /*
   * Remove empty message.
   */

  if (
    results.children.length === 1 &&
    results.firstElementChild
      .classList
      .contains("empty")
  ) {

    results.innerHTML =
      "";
  }


  /*
   * Newest correction
   * appears at the top.
   */

  results.prepend(
    card
  );


  try {

    const response =
      await fetch(
        WORKER,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              text:
                text,

              mode:
                modeEl.value,

              level:
                levelEl.value,

              language:
                languageEl.value

            })

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();


      throw new Error(
        `AI error ${response.status}: ${errorText}`
      );
    }


    if (!response.body) {

      throw new Error(
        "AI returned no response stream."
      );
    }


    /*
     * Read the streaming
     * Workers AI response.
     */

    const reader =
      response.body
        .getReader();


    const decoder =
      new TextDecoder();


    let buffer =
      "";

    let generated =
      "";


    while (true) {

      const result =
        await reader.read();


      if (result.done) {
        break;
      }


      buffer +=
        decoder.decode(
          result.value,
          {
            stream:
              true
          }
        );


      const events =
        buffer.split(
          "\n\n"
        );


      buffer =
        events.pop() ||
        "";


      for (
        const event
        of events
      ) {

        const lines =
          event.split(
            "\n"
          );


        for (
          const line
          of lines
        ) {

          if (
            !line.startsWith(
              "data:"
            )
          ) {

            continue;
          }


          const payload =
            line
              .slice(5)
              .trim();


          if (
            !payload ||
            payload === "[DONE]"
          ) {

            continue;
          }


          try {

            const parsed =
              JSON.parse(
                payload
              );


            if (
              typeof
                parsed.response
                === "string"
            ) {

              generated +=
                parsed.response;


              /*
               * Show the streamed
               * response immediately.
               */

              renderCorrection(
                card,
                generated
              );
            }

          }

          catch {
            /*
             * Ignore incomplete
             * streaming chunks.
             */
          }

        }

      }

    }


    /*
     * Final rendering.
     */

    renderCorrection(
      card,
      generated
    );


  }

  catch (error) {

    console.error(
      "Analysis error:",
      error
    );


    card.innerHTML = `

      <div class="error">
        ${escapeHtml(
          error.message
        )}
      </div>

    `;
  }

}


/* =====================================
   RENDER CORRECTION
===================================== */

function renderCorrection(
  card,
  generated
) {

  const corrected =
    extractLine(
      generated,
      "CORRECTED:"
    );


  const natural =
    extractLine(
      generated,
      "NATURAL:"
    );


  const why =
    extractLine(
      generated,
      "WHY:"
    );


  /*
   * If the model hasn't produced
   * the labels yet, show the
   * streamed text directly.
   */

  if (
    !corrected &&
    !natural &&
    !why
  ) {

    card.innerHTML = `

      <div class="correction-label">
        Correction
      </div>

      <div class="natural">
        ${escapeHtml(
          generated.trim()
        )}
      </div>

    `;

    return;
  }


  card.innerHTML = `

    ${
      corrected
        ? `

          <div class="correction-label">
            Corrected
          </div>

          <div class="corrected">
            ${escapeHtml(
              corrected
            )}
          </div>

        `
        : ""
    }


    ${
      natural
        ? `

          <div
            class="correction-label"
            style="margin-top:12px;"
          >
            More natural
          </div>

          <div class="natural">
            ${escapeHtml(
              natural
            )}
          </div>

        `
        : ""
    }


    ${
      why
        ? `

          <div class="why">
            ${escapeHtml(
              why
            )}
          </div>

        `
        : ""
    }

  `;
}


/* =====================================
   EXTRACT AI LINE
===================================== */

function extractLine(
  text,
  label
) {

  const index =
    text.indexOf(
      label
    );


  if (
    index === -1
  ) {

    return "";
  }


  let value =
    text.slice(
      index +
      label.length
    );


  const labels = [
    "CORRECTED:",
    "NATURAL:",
    "WHY:"
  ];


  for (
    const nextLabel
    of labels
  ) {

    if (
      nextLabel ===
      label
    ) {

      continue;
    }


    const nextIndex =
      value.indexOf(
        nextLabel
      );


    if (
      nextIndex !== -1
    ) {

      value =
        value.slice(
          0,
          nextIndex
        );
    }

  }


  return value
    .replace(
      /\n/g,
      " "
    )
    .trim();
}


/* =====================================
   STOP
===================================== */

stopBtn.addEventListener(
  "click",
  stopListening
);


function stopListening() {

  running =
    false;


  if (recorder) {

    try {

      recorder.stop();

    }

    catch {}

  }


  if (socket) {

    try {

      socket.close();

    }

    catch {}

  }


  cleanup();


  setStatus(
    "Stopped."
  );
}


/* =====================================
   CLEANUP
===================================== */

function cleanup() {

  running =
    false;


  startBtn.disabled =
    false;

  stopBtn.disabled =
    true;


  if (recorder) {

    try {

      recorder.stop();

    }

    catch {}

    recorder =
      null;
  }


  if (socket) {

    try {

      socket.close();

    }

    catch {}

    socket =
      null;
  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function (track) {
          track.stop();
        }
      );

    stream =
      null;
  }
}


/* =====================================
   HTML ESCAPING
===================================== */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}

</script>
