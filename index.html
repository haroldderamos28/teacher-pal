<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Pal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f5f7fb; color: #1f2937; }
    .container { max-width: 1250px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 18px; font-size: 28px; }
    .controls { background: white; padding: 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .control-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    select { padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 8px; background: white; }
    label.check { display: flex; align-items: center; gap: 6px; font-size: 14px; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: bold; }
    #startBtn { background: #111827; color: white; }
    #pauseBtn { background: #d97706; color: white; }
    #stopBtn { background: #dc2626; color: white; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 14px; color: #6b7280; }
    .coach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); min-height: 500px; }
    .panel-header { padding: 14px 16px; font-weight: bold; border-bottom: 1px solid #e5e7eb; background: #fafafa; }
    .panel-body { padding: 16px; }
    #liveTranscript { font-size: 22px; line-height: 1.6; min-height: 100px; }
    .final-line { margin-bottom: 10px; }
    .interim { color: #9ca3af; }
    .correction-card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .correction-label { font-size: 12px; font-weight: bold; color: #6b7280; text-transform: uppercase; margin-bottom: 5px; }
    .corrected { font-size: 20px; font-weight: bold; line-height: 1.4; }
    .natural { font-size: 17px; line-height: 1.4; margin-top: 8px; }
    .why { font-size: 14px; color: #6b7280; margin-top: 10px; line-height: 1.4; }
    .alt { font-size: 14px; color: #1a4fa0; margin-top: 10px; line-height: 1.4; }
    .vocab { font-size: 14px; color: #0a6b3a; margin-top: 10px; line-height: 1.4; }
    .thinking { color: #9ca3af; font-style: italic; }
    .error { color: #dc2626; background: #fef2f2; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; white-space: pre-wrap; }
    .empty { color: #9ca3af; font-size: 15px; }
    .said { font-size: 14px; color: #6b7280; font-style: italic; margin-bottom: 8px; }
    .engine-block { border-top: 1px solid #e5e7eb; padding-top: 10px; margin-top: 10px; }
    .engine-tag { display: inline-block; font-size: 11px; font-weight: bold; color: #374151; background: #eef2f7; border-radius: 999px; padding: 3px 10px; margin-bottom: 8px; }
    @media (max-width: 800px) { .coach-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Teacher Pal</h1>

    <div class="controls">
      <div class="control-row">
        <label>Mode:
          <select id="mode">
            <option value="accurate">Accurate</option>
            <option value="natural" selected>Natural</option>
            <option value="casual">Casual</option>
            <option value="business">Business</option>
            <option value="professional">Professional</option>
            <option value="concise">Concise</option>
            <option value="student">Student-friendly</option>
          </select>
        </label>
        <label>Level:
          <select id="level">
            <option value="basic">Basic</option>
            <option value="intermediate" selected>Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </label>
        <label>Support language:
          <select id="language">
            <option value="en" selected>English</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="zh">Chinese</option>
            <option value="zh-TW">Traditional Chinese</option>
            <option value="vi">Vietnamese</option>
            <option value="th">Thai</option>
            <option value="id">Indonesian</option>
            <option value="ms">Malay</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="nl">Dutch</option>
            <option value="ru">Russian</option>
            <option value="uk">Ukrainian</option>
            <option value="pl">Polish</option>
            <option value="tr">Turkish</option>
            <option value="hi">Hindi</option>
            <option value="el">Greek</option>
            <option value="ro">Romanian</option>
            <option value="hu">Hungarian</option>
            <option value="cs">Czech</option>
            <option value="sk">Slovak</option>
            <option value="bg">Bulgarian</option>
            <option value="sv">Swedish</option>
            <option value="da">Danish</option>
            <option value="no">Norwegian</option>
            <option value="fi">Finnish</option>
            <option value="et">Estonian</option>
            <option value="lv">Latvian</option>
            <option value="lt">Lithuanian</option>
            <option value="ca">Catalan</option>
          </select>
        </label>
        <label>Audio source:
          <select id="audioSource">
            <option value="mic" selected>Microphone</option>
            <option value="tab">Tab / window audio (share screen)</option>
          </select>
        </label>
        <label>Only analyze sentences of at least:
          <select id="minWords">
            <option value="1">1 word</option>
            <option value="4">4 words</option>
            <option value="6" selected>6 words</option>
            <option value="8">8 words</option>
            <option value="10">10 words</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="extras" checked> Show extras (alternatives &amp; vocabulary)</label>
        <label>AI engine:
          <select id="engine">
            <option value="basic" selected>Basic (free AI)</option>
            <option value="haiku">Haiku</option>
            <option value="compare">Compare both</option>
          </select>
        </label>
        <button id="startBtn">Start Listening</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="stopBtn" disabled>Stop</button>
      </div>
      <div class="status" id="status">Ready.</div>
    </div>

    <div class="coach-grid">
      <div class="panel">
        <div class="panel-header">Live Stream</div>
        <div class="panel-body">
          <div id="liveTranscript"><div class="empty">Start listening and speak normally.</div></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">Corrections</div>
        <div class="panel-body" id="results"><div class="empty">Corrections will appear here.</div></div>
      </div>
    </div>
  </div>

<script>
const WORKER = "https://blue-base-6bdc.haroldderamos28.workers.dev";
const SONIOX_URL = "wss://stt-rt.soniox.com/transcribe-websocket";
const SONIOX_MODEL = "stt-rt-v5";
const TARGET_RATE = 16000; // audio is sent to Soniox as 16 kHz mono 16-bit PCM
const LONG_TALK_WORDS = 100; // only if a student talks this long without ever pausing, send what's finished

// When "Support language" is set to anything but English, we treat it as the student's
// own language: Soniox listens for THAT language (plus English, since beginners mix), and
// the Worker translates it to English for the teacher instead of correcting English grammar.
function isTranslating() { return languageEl.value !== "en"; }

let socket = null;
let stream = null;
let audioCtx = null;
let sourceNode = null;
let workletNode = null;
let muteNode = null;
let running = false;
let paused = false;
let finalTranscript = "";
// A turn shorter than the minimum (e.g. "Yesterday…" followed by a thinking pause) is held
// briefly instead of thrown away, so it can join the start of the student's next turn.
const HOLD_SHORT_MS = 8000;
let heldAt = 0;
let holdTimer = null;

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const stopBtn = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");
const liveTranscript = document.getElementById("liveTranscript");
const results = document.getElementById("results");
const modeEl = document.getElementById("mode");
const levelEl = document.getElementById("level");
const languageEl = document.getElementById("language");
const extrasEl = document.getElementById("extras");
const audioSourceEl = document.getElementById("audioSource");
const minWordsEl = document.getElementById("minWords");
const engineEl = document.getElementById("engine");

function wordCount(text) {
  const trimmed = text.trim();
  if (!trimmed) return 0;
  return trimmed.split(/\s+/).length;
}

function setStatus(message) { statusEl.textContent = message; }

// Pulls out every complete sentence (ending in . ? !) from the accumulated text, in
// order, and returns whatever's left over (an unfinished trailing fragment).
function splitComplete(text) {
  const matches = text.match(/[^.?!]*[.?!]+["')\]]*\s*/g) || [];
  let consumed = 0;
  const sentences = [];
  for (const m of matches) {
    const trimmed = m.trim();
    if (trimmed) sentences.push(trimmed);
    consumed += m.length;
  }
  return { sentences: sentences, remainder: text.slice(consumed) };
}

// Soniox expects ISO 639-1 codes; regional variants map to their base language.
function sonioxLanguage(code) {
  return code.split("-")[0];
}

// ---------------------------------------------------------------------------
// Audio capture: the mic/tab audio is turned into 16 kHz mono PCM in a background
// audio thread (an AudioWorklet), in ~100 ms chunks. Raw PCM (instead of recorded
// webm files) means a fresh Soniox connection can start at any moment, which is what
// makes Pause, Resume and language switching clean.
// ---------------------------------------------------------------------------
const WORKLET_CODE = `
class PcmSender extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / ${TARGET_RATE};
    this.leftover = new Float32Array(0);
    this.pos = 0;
    this.out = new Int16Array(1600);
    this.outLen = 0;
  }
  process(inputs) {
    const channel = inputs[0] && inputs[0][0];
    if (!channel) return true;
    const data = new Float32Array(this.leftover.length + channel.length);
    data.set(this.leftover);
    data.set(channel, this.leftover.length);
    const r = this.ratio;
    let pos = this.pos;
    while (pos + r <= data.length) {
      const s = Math.floor(pos);
      const e = Math.min(data.length, Math.ceil(pos + r));
      let sum = 0;
      for (let i = s; i < e; i++) sum += data[i];
      let v = sum / (e - s);
      if (v > 1) v = 1; else if (v < -1) v = -1;
      this.out[this.outLen++] = v < 0 ? v * 0x8000 : v * 0x7fff;
      if (this.outLen === this.out.length) {
        this.port.postMessage(this.out.buffer, [this.out.buffer]);
        this.out = new Int16Array(1600);
        this.outLen = 0;
      }
      pos += r;
    }
    const consumed = Math.floor(pos);
    this.leftover = data.slice(consumed);
    this.pos = pos - consumed;
    return true;
  }
}
registerProcessor("pcm-sender", PcmSender);
`;

async function startAudioPipeline() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === "suspended") { try { await audioCtx.resume(); } catch {} }
  const moduleUrl = URL.createObjectURL(new Blob([WORKLET_CODE], { type: "application/javascript" }));
  try {
    await audioCtx.audioWorklet.addModule(moduleUrl);
  } finally {
    URL.revokeObjectURL(moduleUrl);
  }
  sourceNode = audioCtx.createMediaStreamSource(stream);
  workletNode = new AudioWorkletNode(audioCtx, "pcm-sender");
  // The worklet only runs while connected to the speakers, so route it through a
  // silent gain node — nothing is actually played back.
  muteNode = audioCtx.createGain();
  muteNode.gain.value = 0;
  sourceNode.connect(workletNode);
  workletNode.connect(muteNode);
  muteNode.connect(audioCtx.destination);

  workletNode.port.onmessage = function (event) {
    if (paused || !socket || socket.readyState !== WebSocket.OPEN || !socket._configured) return;
    socket.send(event.data);
  };

  stream.getAudioTracks().forEach(function (track) {
    track.addEventListener("ended", function () {
      if (running) { setStatus("Audio sharing stopped."); stopListening(); }
    });
  });
}

startBtn.addEventListener("click", startListening);

async function startListening() {
  if (running) return;
  startBtn.disabled = true;
  // Created right inside the click so the browser lets audio processing start immediately.
  try { audioCtx = new AudioContext(); } catch {}
  try {
    if (audioSourceEl.value === "tab") {
      setStatus("Choose the tab or window to share, and check \"Share audio\"...");
      const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      const audioTracks = displayStream.getAudioTracks();
      if (audioTracks.length === 0) {
        displayStream.getTracks().forEach(function (track) { track.stop(); });
        throw new Error('No audio was shared. When the share dialog appears, enable "Share audio" (or "Share tab audio").');
      }
      // We only need the audio; stop the video track right away so no extra permission lingers.
      displayStream.getVideoTracks().forEach(function (track) { track.stop(); });
      stream = new MediaStream(audioTracks);
      stream._displaySource = displayStream;
    } else {
      setStatus("Requesting microphone...");
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }

    await startAudioPipeline();
    running = true;
    pauseBtn.disabled = false;
    stopBtn.disabled = false;
    audioSourceEl.disabled = true;
    await connectSocket();

  } catch (error) {
    console.error(error);
    cleanup();
    setStatus(error.message || "Could not start listening.");
  }
}

// Opens a fresh Soniox stream. Called on Start, on Resume, and when the language changes.
async function connectSocket() {
  setStatus("Connecting to the voice engine...");
  const tokenResponse = await fetch(`${WORKER}/token`, { method: "POST" });
  if (!tokenResponse.ok) {
    const errorText = await tokenResponse.text();
    throw new Error(`Voice engine key error: ${errorText}`);
  }
  const tokenData = await tokenResponse.json();
  if (!tokenData.token) throw new Error("Voice engine key was not returned.");
  // The teacher may have pressed Stop or Pause while we were fetching the key.
  if (!running || paused) return;

  const translating = isTranslating();
  // Beginners often mix their own language with English, so listen for both.
  const languageHints = translating ? [sonioxLanguage(languageEl.value), "en"] : ["en"];

  const ws = new WebSocket(SONIOX_URL);
  ws._configured = false;
  ws._ending = false; // true once we've asked this stream to wrap up (pause / switch)
  socket = ws;

  ws.onopen = function () {
    ws.send(JSON.stringify({
      api_key: tokenData.token,
      model: SONIOX_MODEL,
      audio_format: "pcm_s16le",
      sample_rate: TARGET_RATE,
      num_channels: 1,
      language_hints: languageHints,
      enable_endpoint_detection: true,
      // How long a pause must be before Soniox decides the student has finished their
      // thought. Learners pause mid-sentence a lot, so we lean towards waiting.
      max_endpoint_delay_ms: translating ? 3000 : 2500,
      endpoint_sensitivity: translating ? -0.5 : -0.3, // below 0 = less eager to cut off
      context: {
        general: [
          { key: "domain", value: "Online English lesson" },
          { key: "topic", value: "Conversation practice between an ESL teacher and a student" },
        ],
      },
    }));
    ws._configured = true;
    if (ws !== socket) return;
    setStatus("Listening...");
  };

  ws.onmessage = function (event) {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }

    if (data.error_code) {
      console.error("Soniox error:", data);
      ws._errored = true; // keep this message on screen when the connection then closes
      if (ws === socket) setStatus(`Voice engine error: ${data.error_message || data.error_code}. Press Pause, then Resume to reconnect.`);
      return;
    }
    // Messages from a stream we've already replaced (e.g. after a language switch) are ignored.
    if (ws !== socket) return;

    let newFinal = "";
    let interim = "";
    let endpoint = false;
    for (const token of data.tokens || []) {
      if (token.text === "<end>" || token.text === "<fin>") { endpoint = true; continue; }
      if (token.is_final) newFinal += token.text;
      else interim += token.text;
    }

    if (newFinal) {
      if (heldAt) {
        // New speech arrived: a short bit held from the last turn joins this one if it's
        // recent; if it's gone stale, it's dropped.
        if (Date.now() - heldAt > HOLD_SHORT_MS) finalTranscript = "";
        clearHold();
      }
      finalTranscript += newFinal;

      // Normally we wait until the student actually stops talking (the endpoint below)
      // and send the whole thought as one. Mid-thought breaths often get a period, so
      // acting on punctuation alone cut students off. Safety net for long talkers: once
      // the finished sentences add up to LONG_TALK_WORDS, send those now so nothing waits
      // forever. (Translation mode never splits early — beginners pause a lot.)
      if (!isTranslating()) {
        const split = splitComplete(finalTranscript);
        const done = split.sentences.join(" ");
        if (split.sentences.length && wordCount(done) >= LONG_TALK_WORDS) {
          analyzeSentence(done);
          finalTranscript = split.remainder.replace(/^\s+/, "");
        }
      }
    }

    renderLiveTranscript(finalTranscript.trim(), interim);

    // End of an utterance (the student stopped talking), or the stream is wrapping up:
    // send whatever's left as one complete thought.
    if (endpoint || data.finished) flushLeftover();
  };

  ws.onerror = function (event) {
    console.error("Soniox WebSocket error:", event);
    if (ws === socket && !ws._ending && !paused) setStatus("Voice engine error.");
  };

  ws.onclose = function (event) {
    console.log("Soniox closed:", event.code, event.reason);
    if (ws !== socket) return;
    socket = null;
    // Closing is expected when we paused or switched language; otherwise tell the teacher.
    if (running && !paused && !ws._ending && !ws._errored) {
      setStatus(`Voice engine disconnected (${event.code}). Press Pause, then Resume to reconnect.`);
    }
  };
}

// Sends the unfinished leftover text for analysis. In translation mode short beginner
// phrases still matter, so the word-count filter is skipped there.
function flushLeftover() {
  const leftover = finalTranscript.trim();
  const minWords = parseInt(minWordsEl.value, 10);
  clearHold();
  if (!leftover) {
    finalTranscript = "";
    renderLiveTranscript("", "");
    return;
  }
  if (isTranslating() || wordCount(leftover) >= minWords) {
    analyzeSentence(leftover);
    finalTranscript = "";
    renderLiveTranscript("", "");
    return;
  }
  // Too short on its own: hold it (it stays visible in Live Stream) in case the student
  // carries on. If nothing follows in time, quietly drop it.
  heldAt = Date.now();
  renderLiveTranscript(leftover, "");
  holdTimer = setTimeout(function () {
    if (heldAt && Date.now() - heldAt >= HOLD_SHORT_MS) {
      finalTranscript = "";
      heldAt = 0;
      renderLiveTranscript("", "");
    }
  }, HOLD_SHORT_MS);
}

function clearHold() {
  heldAt = 0;
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
}

// Politely ends a stream: Soniox finalizes the last words, sends them, then closes.
function endStream(ws) {
  if (!ws) return;
  ws._ending = true;
  try {
    if (ws.readyState === WebSocket.OPEN) ws.send(new ArrayBuffer(0));
    else ws.close();
  } catch {}
}

// Changing the language needs a fresh stream with new language hints. The mic/tab audio
// keeps running, so there's no new permission prompt.
languageEl.addEventListener("change", async function () {
  if (!running || paused) return; // not listening (or paused) — the next connect picks this up
  const old = socket;
  socket = null; // stop sending audio to the old stream right away
  finalTranscript = "";
  clearHold();
  renderLiveTranscript("", "");
  if (old) { old._ending = true; try { old.close(); } catch {} }
  setStatus(isTranslating() ? "Switching to " + languageEl.options[languageEl.selectedIndex].text + "..." : "Switching to English...");
  try {
    await connectSocket();
  } catch (error) {
    setStatus(error.message || "Could not switch language.");
  }
});

pauseBtn.addEventListener("click", function () {
  if (paused) resumeListening(); else pauseListening();
});

// Pausing closes the Soniox stream completely (Soniox bills for every second a stream is
// open, even silent ones). The last words spoken are still finalized and analyzed.
function pauseListening() {
  if (!running || paused) return;
  paused = true;
  endStream(socket);
  pauseBtn.textContent = "Resume";
  setStatus("Paused. Nothing is being sent or billed.");
}

// Resuming opens a brand-new stream; the mic/tab audio was never stopped, so no prompt.
async function resumeListening() {
  if (!running || !paused) return;
  pauseBtn.disabled = true;
  try {
    paused = false;
    finalTranscript = "";
    clearHold();
    renderLiveTranscript("", "");
    pauseBtn.textContent = "Pause";
    await connectSocket();
  } catch (error) {
    paused = true;
    pauseBtn.textContent = "Resume";
    setStatus(error.message || "Could not resume.");
  } finally {
    pauseBtn.disabled = false;
  }
}

function renderLiveTranscript(finalText, interimText) {
  liveTranscript.innerHTML = `
    <div class="final-line">${escapeHtml(finalText)}</div>
    <div class="interim">${escapeHtml(interimText)}</div>
  `;
}

const ENGINE_NAMES = { basic: "Basic (free AI)", haiku: "Haiku" };

function analyzeSentence(text) {
  // Capture the settings at call time so a dropdown change while this request is still
  // in flight doesn't change how its own result gets rendered.
  const translating = isTranslating();
  const choice = engineEl.value;
  const engines = choice === "compare" ? ["basic", "haiku"] : [choice];

  const card = document.createElement("div");
  card.className = "correction-card";

  if (results.children.length === 1 && results.firstElementChild.classList.contains("empty")) {
    results.innerHTML = "";
  }
  results.prepend(card);

  const settings = {
    text: text,
    mode: modeEl.value,
    level: levelEl.value,
    language: languageEl.value,
    extras: extrasEl.checked,
    translate: translating,
  };

  if (engines.length === 1) {
    // One engine: the card itself shows the result.
    card.dataset.translating = translating ? "1" : "0";
    runAnalysis(card, null, settings, engines[0]);
    return;
  }

  // Compare: the student's words on top, then each engine's answer in its own section,
  // with how long each one took, so you can judge them side by side.
  card.innerHTML = `<div class="said">${escapeHtml(text)}</div>`;
  for (const engine of engines) {
    const section = document.createElement("div");
    section.className = "engine-block";
    const tag = document.createElement("div");
    tag.className = "engine-tag";
    tag.textContent = ENGINE_NAMES[engine];
    const body = document.createElement("div");
    body.dataset.translating = translating ? "1" : "0";
    section.append(tag, body);
    card.append(section);
    runAnalysis(body, tag, settings, engine);
  }
}

async function runAnalysis(card, tag, settings, engine) {
  const translating = settings.translate;
  card.innerHTML = `<div class="thinking">${translating ? "Translating..." : "Analyzing..."}</div>`;
  const started = performance.now();

  try {
    const response = await fetch(WORKER, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({}, settings, { engine: engine })),
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(`AI error ${response.status}: ${errorText}`);
    }
    if (!response.body) throw new Error("AI returned no response stream.");

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let generated = "";

    while (true) {
      const result = await reader.read();
      if (result.done) break;
      buffer += decoder.decode(result.value, { stream: true });
      const events = buffer.split("\n\n");
      buffer = events.pop() || "";

      for (const event of events) {
        const lines = event.split("\n");
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          try {
            const parsed = JSON.parse(payload);
            if (typeof parsed.response === "string") {
              generated += parsed.response;
              renderCorrection(card, generated);
            }
          } catch {}
        }
      }
    }
    renderCorrection(card, generated);
    if (tag) tag.textContent = ENGINE_NAMES[engine] + " · " + ((performance.now() - started) / 1000).toFixed(1) + "s";
  } catch (error) {
    console.error("Analysis error:", error);
    card.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
  }
}

// Every labeled section the AI might send, in this exact order, so extractLine() always
// knows where one section ends and the next begins.
const ALL_LABELS = ["CORRECTED:", "NATURAL:", "WHY:", "ALTERNATIVES:", "VOCAB:"];

function renderCorrection(card, generated) {
  const translating = card.dataset.translating === "1";
  const corrected = extractLine(generated, "CORRECTED:");
  const natural = extractLine(generated, "NATURAL:");
  const why = extractLine(generated, "WHY:");
  const alternatives = extractLine(generated, "ALTERNATIVES:");
  const vocab = extractLine(generated, "VOCAB:");

  if (!corrected && !natural && !why && !alternatives && !vocab) {
    card.innerHTML = `
      <div class="correction-label">${translating ? "Translation" : "Correction"}</div>
      <div class="natural">${escapeHtml(generated.trim())}</div>
    `;
    return;
  }

  card.innerHTML = `
    ${corrected ? `
      <div class="correction-label">${translating ? "Translation" : "Corrected"}</div>
      <div class="corrected">${escapeHtml(corrected)}</div>
    ` : ""}

    ${natural ? `
      <div class="correction-label" style="margin-top:12px;">${translating ? "Suggested English phrase" : "More natural"}</div>
      <div class="natural">${escapeHtml(natural)}</div>
    ` : ""}

    ${why ? `<div class="why">${escapeHtml(why)}</div>` : ""}

    ${alternatives ? `
      <div class="correction-label" style="margin-top:12px;">Other ways to say it</div>
      <div class="alt">${escapeHtml(alternatives.replace(/\|/g, "•"))}</div>
    ` : ""}

    ${vocab ? `
      <div class="correction-label" style="margin-top:12px;">Vocabulary</div>
      <div class="vocab">${escapeHtml(vocab)}</div>
    ` : ""}
  `;
}

function extractLine(text, label) {
  const index = text.indexOf(label);
  if (index === -1) return "";
  let value = text.slice(index + label.length);

  for (const nextLabel of ALL_LABELS) {
    if (nextLabel === label) continue;
    const nextIndex = value.indexOf(nextLabel);
    if (nextIndex !== -1) value = value.slice(0, nextIndex);
  }

  return value.replace(/\n/g, " ").trim();
}

stopBtn.addEventListener("click", stopListening);

function stopListening() {
  cleanup();
  setStatus("Stopped.");
}

function cleanup() {
  running = false;
  paused = false;
  finalTranscript = "";
  clearHold();
  const ws = socket;
  socket = null;
  if (ws) { ws._ending = true; try { ws.close(); } catch {} }
  startBtn.disabled = false;
  pauseBtn.disabled = true;
  pauseBtn.textContent = "Pause";
  stopBtn.disabled = true;
  if (workletNode) { try { workletNode.port.onmessage = null; workletNode.disconnect(); } catch {} workletNode = null; }
  if (sourceNode) { try { sourceNode.disconnect(); } catch {} sourceNode = null; }
  if (muteNode) { try { muteNode.disconnect(); } catch {} muteNode = null; }
  if (audioCtx) { try { audioCtx.close(); } catch {} audioCtx = null; }
  if (stream) {
    stream.getTracks().forEach(function (track) { track.stop(); });
    if (stream._displaySource) stream._displaySource.getTracks().forEach(function (track) { track.stop(); });
    stream = null;
  }
  audioSourceEl.disabled = false;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>
