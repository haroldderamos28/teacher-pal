<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Pal – Live Coaching</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: .2rem 1rem; }
  label { display: block; font-size: .9rem; color: #555; margin-top: .8rem; }
  select { width: 100%; padding: .55rem; margin-top: .25rem; box-sizing: border-box; }
  .check { display: flex; align-items: center; gap: .5rem; margin-top: 1rem; font-size: .95rem; color: #333; }
  button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
  #status { margin: .8rem 0; color: #666; }
  .cols, .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 1rem; }
  .cols { font-weight: 600; border-bottom: 2px solid #ddd; padding-bottom: .4rem; }
  .row { padding: .7rem 0; border-bottom: 1px solid #eee; line-height: 1.5; }
  .fb div { margin-bottom: .25rem; }
  .fix { color: #b00020; font-weight: 500; }
  .nat { color: #0a6b3a; font-weight: 500; }
  .tip { color: #555; }
  .ask { color: #1a4fa0; }
  .ok { color: #888; }
  .trn { color: #0a6b3a; font-weight: 500; }
  .sug { color: #1a4fa0; }
  .interim { color: #999; padding: .7rem 0; min-height: 1.4rem; }
  .err { color: #b00020; }
  .muted { color: #888; font-style: italic; font-weight: 400; }
  .ver { color: #aaa; font-size: .75rem; margin-top: 2rem; }
  @media (max-width: 600px) { .controls, .cols, .row { grid-template-columns: 1fr; gap: .3rem; } }
</style>
</head>
<body>
  <h1>Live Coaching</h1>

  <div class="controls">
    <div>
      <label for="lang">Student is speaking</label>
      <select id="lang">
        <option value="en">English (get corrections)</option>
        <optgroup label="Translate to English">
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh">Mandarin Chinese</option>
          <option value="zh-TW">Mandarin Chinese (Traditional)</option>
          <option value="zh-HK">Cantonese</option>
          <option value="vi">Vietnamese</option>
          <option value="th">Thai</option>
          <option value="id">Indonesian</option>
          <option value="ms">Malay</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="nl">Dutch</option>
          <option value="ru">Russian</option>
          <option value="uk">Ukrainian</option>
          <option value="pl">Polish</option>
          <option value="tr">Turkish</option>
          <option value="hi">Hindi</option>
          <option value="el">Greek</option>
          <option value="ro">Romanian</option>
          <option value="hu">Hungarian</option>
          <option value="cs">Czech</option>
          <option value="sk">Slovak</option>
          <option value="bg">Bulgarian</option>
          <option value="sv">Swedish</option>
          <option value="da">Danish</option>
          <option value="no">Norwegian</option>
          <option value="fi">Finnish</option>
        </optgroup>
      </select>
    </div>
    <div>
      <label for="source">Audio source</label>
      <select id="source">
        <option value="tab">Tab / system audio (the other person's voice)</option>
        <option value="mic">My microphone (my voice)</option>
      </select>
    </div>
  </div>

  <div class="controls" id="englishControls">
    <div>
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="natural">Natural</option>
        <option value="accurate">Accurate (corrections only)</option>
        <option value="casual">Casual</option>
        <option value="business">Business</option>
        <option value="professional">Professional (formal)</option>
        <option value="concise">Concise</option>
        <option value="student">Student level (simple words)</option>
      </select>
    </div>
    <div>
      <label for="level">Difficulty</label>
      <select id="level">
        <option value="basic">Basic</option>
        <option value="intermediate" selected>Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="extras"> Show extras (other ways to say it, vocabulary)</label>
    <label class="check"><input type="checkbox" id="hideShort"> Hide short replies (ok, yes, right, etc.) instead of showing a checkmark</label>
  </div>

  <div class="controls" id="translateControls" style="display:none">
    <div>
      <label for="translateLevel">Student's level</label>
      <select id="translateLevel">
        <option value="basic">Basic</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </div>
  </div>

  <button id="toggle">Start Listening</button>
  <button id="pauseBtn" style="display:none">Pause</button>
  <div id="status">Not connected.</div>
  <div id="interim" class="interim"></div>

  <div class="cols"><div id="colLeft">Student said</div><div id="colRight">Feedback</div></div>
  <div id="rows"></div>
  <div class="ver">version 10</div>

<script>
  const WORKER = 'https://blue-base-6bdc.haroldderamos28.workers.dev';

  const $ = (id) => document.getElementById(id);
  const langEl = $('lang'), modeEl = $('mode'), levelEl = $('level'), extrasEl = $('extras');
  const translateLevelEl = $('translateLevel');
  const englishControlsEl = $('englishControls'), translateControlsEl = $('translateControls');
  const toggleBtn = $('toggle'), pauseBtn = $('pauseBtn'), statusEl = $('status'), rowsEl = $('rows'), interimEl = $('interim');

  function isTranslating() { return langEl.value !== 'en'; }

  function updateControlVisibility() {
    const t = isTranslating();
    englishControlsEl.style.display = t ? 'none' : '';
    translateControlsEl.style.display = t ? '' : 'none';
    $('colLeft').textContent = t ? 'Student said (their language)' : 'Student said';
    $('colRight').textContent = t ? 'English translation' : 'Feedback';
  }
  updateControlVisibility();

  let socket = null, recorder = null, stream = null, displayStream = null, running = false, paused = false, buffer = '', watchdog = null, lastActivity = 0, keepAliveTimer = null;

  function startKeepAlive() {
    clearInterval(keepAliveTimer);
    // Deepgram closes the connection after ~10-12s with no audio, so while paused we
    // send a tiny "still here" ping instead of real audio, to keep the connection open.
    keepAliveTimer = setInterval(() => {
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'KeepAlive' }));
    }, 8000);
  }
  function stopKeepAlive() { clearInterval(keepAliveTimer); }

  // Remember the teacher's settings
  try {
    modeEl.value = localStorage.getItem('tp_mode') || 'natural';
    levelEl.value = localStorage.getItem('tp_level') || 'intermediate';
    extrasEl.checked = localStorage.getItem('tp_extras') === '1';
  } catch (e) {}
  modeEl.addEventListener('change', () => { try { localStorage.setItem('tp_mode', modeEl.value); } catch (e) {} });
  levelEl.addEventListener('change', () => { try { localStorage.setItem('tp_level', levelEl.value); } catch (e) {} });
  extrasEl.addEventListener('change', () => { try { localStorage.setItem('tp_extras', extrasEl.checked ? '1' : '0'); } catch (e) {} });
  const hideShortEl = $('hideShort');
  try { hideShortEl.checked = localStorage.getItem('tp_hideShort') === '1'; } catch (e) {}
  hideShortEl.addEventListener('change', () => { try { localStorage.setItem('tp_hideShort', hideShortEl.checked ? '1' : '0'); } catch (e) {} });
  try {
    langEl.value = localStorage.getItem('tp_lang') || 'en';
    translateLevelEl.value = localStorage.getItem('tp_translateLevel') || 'basic';
  } catch (e) {}
  updateControlVisibility();
  langEl.addEventListener('change', () => {
    try { localStorage.setItem('tp_lang', langEl.value); } catch (e) {}
    updateControlVisibility();
    // Switching languages mid-session needs a fresh Deepgram connection.
    if (running) { stop(); start(); }
  });
  translateLevelEl.addEventListener('change', () => { try { localStorage.setItem('tp_translateLevel', translateLevelEl.value); } catch (e) {} });

  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();

  // Short acknowledgements / backchannel replies that don't need AI feedback.
  // Matched only as a WHOLE reply (after stripping punctuation), not as part of a longer sentence.
  const SKIP_PHRASES = new Set([
    'ok','okay','alright','all right','right','yes','yeah','yep','yup','no','nope','nah',
    'sure','sure thing','of course','fine','good','great','cool','nice','wow','really',
    'i see','i understand','i know','got it','understood','exactly','correct','true',
    'thanks','thank you','no problem','youre welcome','welcome',
    'i think so','i dont think so','i guess so','me too','same here','i agree','i disagree',
    'maybe','perhaps','sometimes','always','never','not really','not yet','not sure',
    'yes i do','no i dont','yes i am','no im not','yes it is','no it isnt',
    'yes i did','no i didnt','yes i have','no i havent','yes i can','no i cant',
    'yes please','no thanks','no thank you'
  ]);
  function isSkippable(text) {
    return SKIP_PHRASES.has(norm(text));
  }

  function line(parent, cls, text) {
    if (!text) return;
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    parent.append(d);
  }

  function makeRow(text) {
    const row = document.createElement('div');
    row.className = 'row';
    const left = document.createElement('div'); left.textContent = text;
    const right = document.createElement('div'); right.className = 'fb';
    row.append(left, right);
    rowsEl.prepend(row);
    return right;
  }

  async function analyse(text) {
    const box = makeRow(text);
    box.textContent = '…';
    try {
      const res = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, mode: modeEl.value, level: levelEl.value, extras: extrasEl.checked }),
      });
      const d = await res.json();
      box.textContent = '';
      if (!d.correction) { line(box, 'err', 'Error: ' + (d.error || 'unknown')); return; }

      if (norm(d.correction) === norm(text)) line(box, 'ok', '✓ No correction needed');
      else line(box, 'fix', '🔴 ' + d.correction);
      if (d.natural && norm(d.natural) !== norm(d.correction)) line(box, 'nat', '🟢 ' + d.natural);
      line(box, 'tip', d.explanation ? '💡 ' + d.explanation : '');
      line(box, 'ask', d.followup ? '💬 ' + d.followup : '');
      if (d.alternatives && d.alternatives.length) line(box, 'tip', '🔁 ' + d.alternatives.join('  •  '));
      line(box, 'tip', d.vocabulary ? '📚 ' + d.vocabulary : '');
    } catch (e) {
      box.textContent = '';
      line(box, 'err', 'Could not reach the server.');
    }
  }

  function addUnfinished(text) {
    const box = makeRow(text);
    line(box, 'muted', '(unfinished, not analysed)');
  }

  function addSkipped(text) {
    const box = makeRow(text);
    line(box, 'ok', '✓');
  }

  function flush() {
    const text = buffer.trim();
    buffer = '';
    interimEl.textContent = '';
    if (!text) return;
    if (isTranslating()) { translateText(text); return; }
    // Only finished sentences go to the AI. Trailing-off fragments are shown as-is so nothing gets invented.
    if (!/[.?!]["')\]]*$/.test(text)) { addUnfinished(text); return; }
    if (isSkippable(text)) { if (!hideShortEl.checked) addSkipped(text); return; }
    analyse(text);
  }

  async function start() {
    try {
      if ($('source').value === 'mic') {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } else {
        displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        const audioTracks = displayStream.getAudioTracks();
        if (!audioTracks.length) {
          displayStream.getTracks().forEach(t => t.stop());
          statusEl.textContent = 'No audio shared. Pick a Chrome Tab (or Entire Screen on Windows) and tick "Share tab audio" / "Share system audio".';
          return;
        }
        displayStream.getVideoTracks().forEach(t => t.stop());
        stream = new MediaStream(audioTracks);
        audioTracks[0].onended = () => { if (running) stop(); };
      }
    } catch (e) { statusEl.textContent = 'Could not start audio: ' + e.message; return; }

    // Ask the Worker for a short-lived Deepgram token (valid ~30 seconds, so fetch it right before connecting)
    statusEl.textContent = 'Connecting…';
    let token;
    try {
      const r = await fetch(WORKER + '/token', { method: 'POST' });
      const d = await r.json();
      if (!d.token) throw new Error(d.error || 'No token');
      token = d.token;
    } catch (e) {
      statusEl.textContent = 'Could not get access: ' + e.message;
      stop();
      return;
    }

    // English uses nova-3 (most accurate for English). Other languages use nova-2,
    // which covers 36+ languages including Japanese, Korean, and Mandarin.
    const dgModel = isTranslating() ? 'nova-2' : 'nova-3';
    const dgLang = isTranslating() ? langEl.value : 'en';
    const url = 'wss://api.deepgram.com/v1/listen?model=' + dgModel + '&language=' + dgLang +
      '&smart_format=true&interim_results=true&endpointing=1200';
    socket = new WebSocket(url, ['bearer', token]);

    socket.onopen = () => {
      statusEl.textContent = 'Listening… speak now.';
      recorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
      recorder.ondataavailable = (e) => {
        // While paused we keep recording (so the share/mic permission stays alive)
        // but don't send the audio anywhere, so nothing gets transcribed or analysed.
        if (paused) return;
        if (e.data.size > 0 && socket.readyState === WebSocket.OPEN) socket.send(e.data);
      };
      recorder.start(250);
    };

    socket.onmessage = (msg) => {
      if (paused) return;
      const data = JSON.parse(msg.data);
      const alt = data.channel && data.channel.alternatives && data.channel.alternatives[0];
      const text = alt && alt.transcript;
      if (text) {
        lastActivity = Date.now();
        if (data.is_final) { buffer += text + ' '; interimEl.textContent = buffer; }
        else { interimEl.textContent = buffer + text; }
      }
      if (data.speech_final) {
        if (isTranslating()) flush(); // translation doesn't need the sentence-ending punctuation check
        // A finished English sentence (ends with . ? or !) goes out right away.
        // Anything else waits; the watchdog below shows it as unfinished after 6 quiet seconds.
        else if (/[.?!]["')\]]*\s*$/.test(buffer.trim())) flush();
      }
    };

    socket.onerror = () => { statusEl.textContent = 'Connection error. Please try again.'; };
    socket.onclose = () => { if (running) stop(); };

    running = true;
    lastActivity = Date.now();
    clearInterval(watchdog);
    watchdog = setInterval(() => {
      if (paused || !buffer.trim()) return;
      const waited = Date.now() - lastActivity;
      if (waited > 6000) { flush(); statusEl.textContent = 'Listening… speak now.'; }
      else if (waited > 1500) statusEl.textContent = 'Holding an unfinished sentence… ' + Math.ceil((6000 - waited) / 1000) + 's';
    }, 500);
    toggleBtn.textContent = 'Stop';
    paused = false;
    pauseBtn.textContent = 'Pause';
    pauseBtn.style.display = '';
  }

  function stop() {
    running = false;
    paused = false;
    stopKeepAlive();
    clearInterval(watchdog);
    flush();
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (displayStream) displayStream.getTracks().forEach(t => t.stop());
    if (socket && socket.readyState === WebSocket.OPEN) socket.close();
    toggleBtn.textContent = 'Start Listening';
    pauseBtn.style.display = 'none';
    if (!statusEl.textContent.startsWith('Could not') && !statusEl.textContent.startsWith('No audio')) statusEl.textContent = 'Stopped.';
  }

  toggleBtn.addEventListener('click', () => (running ? stop() : start()));

  pauseBtn.addEventListener('click', () => {
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    if (paused) {
      flush(); // send anything already captured before the pause takes effect
      stopKeepAlive();
      startKeepAlive();
      statusEl.textContent = 'Paused. Not listening — click Resume to continue.';
    } else {
      stopKeepAlive();
      lastActivity = Date.now();
      statusEl.textContent = 'Listening… speak now.';
    }
  });
</script>
</body>
</html>
