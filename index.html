<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Pal – Live Coaching Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  label { display: block; font-size: .9rem; color: #555; margin-top: .8rem; }
  input, select { width: 100%; padding: .55rem; margin-top: .25rem; box-sizing: border-box; }
  button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
  #status { margin: .8rem 0; color: #666; }
  .cols, .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .cols { font-weight: 600; border-bottom: 2px solid #ddd; padding-bottom: .4rem; }
  .row { padding: .7rem 0; border-bottom: 1px solid #eee; line-height: 1.5; }
  .polished { color: #0a6b3a; font-weight: 500; }
  .interim { color: #999; padding: .7rem 0; min-height: 1.4rem; }
  .err { color: #b00020; }
  @media (max-width: 600px) { .cols, .row { grid-template-columns: 1fr; gap: .3rem; } }
</style>
</head>
<body>
  <h1>Live Coaching Test</h1>

  <label for="key">Deepgram API key (not saved)</label>
  <input id="key" type="password" placeholder="Paste your Teacher Pal key">

  <label for="worker">Your Worker URL</label>
  <input id="worker" type="text" placeholder="https://teacher-pal-polish.YOURNAME.workers.dev">

  <label for="style">Polish style</label>
  <select id="style">
    <option value="business">Business English</option>
    <option value="casual">Casual conversation</option>
    <option value="neutral">Neutral / natural</option>
  </select>

  <label for="source">Audio source</label>
  <select id="source">
    <option value="tab">Tab / system audio (the other person's voice)</option>
    <option value="mic">My microphone (my voice)</option>
  </select>

  <button id="toggle">Start Listening</button>
  <div id="status">Not connected.</div>

  <div class="cols"><div>Student said</div><div>Polished</div></div>
  <div id="rows"></div>
  <div id="interim" class="interim"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const keyEl = $('key'), workerEl = $('worker'), styleEl = $('style');
  const toggleBtn = $('toggle'), statusEl = $('status'), rowsEl = $('rows'), interimEl = $('interim');

  let socket = null, recorder = null, stream = null, displayStream = null, running = false, buffer = '';

  try { workerEl.value = localStorage.getItem('tp_worker') || ''; styleEl.value = localStorage.getItem('tp_style') || 'business'; } catch (e) {}
  workerEl.addEventListener('change', () => { try { localStorage.setItem('tp_worker', workerEl.value.trim()); } catch (e) {} });
  styleEl.addEventListener('change', () => { try { localStorage.setItem('tp_style', styleEl.value); } catch (e) {} });

  async function polish(text) {
    const row = document.createElement('div');
    row.className = 'row';
    const left = document.createElement('div'); left.textContent = text;
    const right = document.createElement('div'); right.className = 'polished'; right.textContent = '…';
    row.append(left, right);
    rowsEl.prepend(row);

    try {
      const res = await fetch(workerEl.value.trim(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, style: styleEl.value }),
      });
      const data = await res.json();
      if (data.polished) right.textContent = data.polished;
      else { right.textContent = 'Error: ' + (data.error || 'unknown'); right.classList.add('err'); }
    } catch (e) {
      right.textContent = 'Could not reach the Worker. Check the URL.';
      right.classList.add('err');
    }
  }

  function flush() {
    const text = buffer.trim();
    buffer = '';
    interimEl.textContent = '';
    if (text) polish(text);
  }

  async function start() {
    const apiKey = keyEl.value.trim();
    if (!apiKey) { statusEl.textContent = 'Paste your Deepgram key first.'; return; }
    if (!workerEl.value.trim()) { statusEl.textContent = 'Paste your Worker URL first.'; return; }

    try {
      if ($('source').value === 'mic') {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } else {
        // Chrome requires video:true here; we throw the video away and keep only the audio
        displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        const audioTracks = displayStream.getAudioTracks();
        if (!audioTracks.length) {
          displayStream.getTracks().forEach(t => t.stop());
          statusEl.textContent = 'No audio shared. Pick a Chrome Tab (or Entire Screen on Windows) and tick "Share tab audio" / "Share system audio".';
          return;
        }
        displayStream.getVideoTracks().forEach(t => t.stop());
        stream = new MediaStream(audioTracks);
        audioTracks[0].onended = () => { if (running) stop(); };
      }
    } catch (e) { statusEl.textContent = 'Could not start audio: ' + e.message; return; }

    const url = 'wss://api.deepgram.com/v1/listen?model=nova-3&language=en&smart_format=true&interim_results=true&endpointing=700';
    socket = new WebSocket(url, ['token', apiKey]);

    socket.onopen = () => {
      statusEl.textContent = 'Listening… speak now.';
      recorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
      recorder.ondataavailable = (e) => {
        if (e.data.size > 0 && socket.readyState === WebSocket.OPEN) socket.send(e.data);
      };
      recorder.start(250);
    };

    socket.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      const alt = data.channel && data.channel.alternatives && data.channel.alternatives[0];
      const text = alt && alt.transcript;
      if (text) {
        if (data.is_final) { buffer += text + ' '; interimEl.textContent = buffer; }
        else { interimEl.textContent = buffer + text; }
      }
      // Speaker paused = sentence finished: send it to be polished
      if (data.speech_final) flush();
    };

    socket.onerror = () => { statusEl.textContent = 'Connection error. Check your Deepgram key.'; };
    socket.onclose = () => { if (running) stop(); };

    running = true;
    toggleBtn.textContent = 'Stop';
  }

  function stop() {
    running = false;
    flush();
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (displayStream) displayStream.getTracks().forEach(t => t.stop());
    if (socket && socket.readyState === WebSocket.OPEN) socket.close();
    toggleBtn.textContent = 'Start Listening';
    statusEl.textContent = 'Stopped.';
  }

  toggleBtn.addEventListener('click', () => (running ? stop() : start()));
</script>
</body>
</html>
