<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Pal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select,
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    #toggleBtn {
      background: #2563eb;
      color: white;
    }

    #pauseBtn {
      background: #f59e0b;
      color: white;
      display: none;
    }

    #clearBtn {
      background: #e5e7eb;
      color: #222;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #475569;
      font-weight: bold;
    }

    .transcript {
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .analysis {
      line-height: 1.6;
    }

    .item {
      border-top: 1px solid #eee;
      padding: 18px 0;
    }

    .item:first-child {
      border-top: none;
    }

    .original {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .good {
      color: #15803d;
    }

    .warning {
      color: #b45309;
    }

    .translation {
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
    }

    .small {
      color: #777;
      font-size: 13px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .checkbox-row input {
      width: auto;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }

      .panel {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="panel">
    <h1>Teacher Pal</h1>
    <div class="subtitle">
      Live speaking coach for teachers
    </div>

    <div class="controls">

      <div>
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="accurate">Accurate</option>
          <option value="natural" selected>Natural</option>
          <option value="casual">Casual</option>
          <option value="business">Business</option>
          <option value="professional">Professional</option>
          <option value="concise">Concise</option>
          <option value="student">Student-friendly</option>
        </select>
      </div>

      <div>
        <label for="level">Level</label>
        <select id="level">
          <option value="basic">Basic</option>
          <option value="intermediate" selected>Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>

      <div>
        <label for="lang">Student language</label>
        <select id="lang">
          <option value="en" selected>English</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh">Chinese</option>
          <option value="zh-TW">Chinese Traditional</option>
          <option value="zh-HK">Chinese Hong Kong</option>
          <option value="vi">Vietnamese</option>
          <option value="th">Thai</option>
          <option value="id">Indonesian</option>
          <option value="ms">Malay</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="nl">Dutch</option>
          <option value="ru">Russian</option>
          <option value="uk">Ukrainian</option>
          <option value="pl">Polish</option>
          <option value="tr">Turkish</option>
          <option value="hi">Hindi</option>
          <option value="el">Greek</option>
          <option value="ro">Romanian</option>
          <option value="hu">Hungarian</option>
          <option value="cs">Czech</option>
          <option value="sk">Slovak</option>
          <option value="bg">Bulgarian</option>
          <option value="sv">Swedish</option>
          <option value="da">Danish</option>
          <option value="no">Norwegian</option>
          <option value="fi">Finnish</option>
          <option value="et">Estonian</option>
          <option value="lv">Latvian</option>
          <option value="lt">Lithuanian</option>
          <option value="ca">Catalan</option>
        </select>
      </div>

      <div>
        <label for="minWords">Minimum words</label>
        <input
          type="number"
          id="minWords"
          value="3"
          min="1"
          max="30"
        >
      </div>

    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="hideShort" checked>
      <label for="hideShort">Ignore very short sentences</label>
    </div>

    <div style="margin-top:15px;">
      <label for="extras">Extra instructions</label>
      <textarea
        id="extras"
        placeholder="Optional instructions for Teacher Pal..."
      ></textarea>
    </div>

    <div class="button-row">
      <button id="toggleBtn">Start Listening</button>
      <button id="pauseBtn">Pause</button>
      <button id="clearBtn">Clear</button>
    </div>

    <div id="status" class="status">
      Voice engine ready.
    </div>
  </div>


  <div class="panel">
    <h2>Live Transcript</h2>

    <div id="liveTranscript" class="transcript">
      Nothing heard yet.
    </div>
  </div>


  <div class="panel">
    <h2>Coaching</h2>

    <div id="results">
      Your corrections and suggestions will appear here.
    </div>
  </div>

</div>


<script>

const WORKER =
  'https://blue-base-6bdc.haroldderamos28.workers.dev';


// ------------------------------------------------------------
// DOM
// ------------------------------------------------------------

const toggleBtn = document.getElementById('toggleBtn');
const pauseBtn = document.getElementById('pauseBtn');
const clearBtn = document.getElementById('clearBtn');

const statusEl = document.getElementById('status');
const liveTranscriptEl =
  document.getElementById('liveTranscript');

const resultsEl =
  document.getElementById('results');

const modeEl =
  document.getElementById('mode');

const levelEl =
  document.getElementById('level');

const langEl =
  document.getElementById('lang');

const minWordsEl =
  document.getElementById('minWords');

const hideShortEl =
  document.getElementById('hideShort');

const extrasEl =
  document.getElementById('extras');


// ------------------------------------------------------------
// STATE
// ------------------------------------------------------------

let socket = null;
let recorder = null;
let stream = null;

let running = false;
let stopping = false;
let paused = false;

let keepAliveTimer = null;

let lastTranscript = '';
let lastAnalyzedTranscript = '';


// ------------------------------------------------------------
// STATUS
// ------------------------------------------------------------

function setStatus(message) {
  statusEl.textContent = message;
}


// ------------------------------------------------------------
// KEEP ALIVE
// ------------------------------------------------------------

function startKeepAlive() {

  stopKeepAlive();

  keepAliveTimer = setInterval(() => {

    if (
      socket &&
      socket.readyState === WebSocket.OPEN
    ) {

      try {
        socket.send(
          JSON.stringify({
            type: 'KeepAlive'
          })
        );
      } catch (error) {
        console.error(
          'KeepAlive error:',
          error
        );
      }

    }

  }, 5000);
}


function stopKeepAlive() {

  if (keepAliveTimer) {
    clearInterval(keepAliveTimer);
    keepAliveTimer = null;
  }

}


// ------------------------------------------------------------
// GET TEMPORARY DEEPGRAM TOKEN
// ------------------------------------------------------------

async function getDeepgramToken() {

  const response = await fetch(
    `${WORKER}/token`,
    {
      method: 'POST'
    }
  );

  if (!response.ok) {

    throw new Error(
      `Token request failed: ${response.status}`
    );

  }

  const data = await response.json();

  if (!data.token) {
    throw new Error(
      'Deepgram token was not returned by the Worker.'
    );
  }

  return data.token;
}


// ------------------------------------------------------------
// START LISTENING
// ------------------------------------------------------------

async function startListening() {

  if (running) {
    return;
  }

  stopping = false;
  paused = false;

  try {

    setStatus(
      'Connecting to voice engine...'
    );

    toggleBtn.disabled = true;

    // --------------------------------------------------------
    // Get microphone
    // --------------------------------------------------------

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    // --------------------------------------------------------
    // Get temporary Deepgram token
    // --------------------------------------------------------

    const token =
      await getDeepgramToken();

    console.log(
      'Deepgram temporary token received.'
    );

    // --------------------------------------------------------
    // Language
    // --------------------------------------------------------

    const targetLang =
      langEl.value;

    // --------------------------------------------------------
    // Deepgram WebSocket URL
    // --------------------------------------------------------

    const deepgramUrl =
      'wss://api.deepgram.com/v1/listen' +
      '?model=nova-3' +
      `&language=${encodeURIComponent(targetLang)}` +
      '&smart_format=true' +
      '&interim_results=true' +
      '&utterance_end_ms=1000';

    console.log(
      'Connecting to Deepgram:',
      deepgramUrl
    );

    // --------------------------------------------------------
    // IMPORTANT:
    // Temporary JWT token uses BEARER authentication.
    // --------------------------------------------------------

    socket = new WebSocket(
      deepgramUrl,
      [
        'bearer',
        token
      ]
    );


    // --------------------------------------------------------
    // WebSocket OPEN
    // --------------------------------------------------------

    socket.onopen = () => {

      console.log(
        'Deepgram WebSocket connected.'
      );

      running = true;
      stopping = false;

      toggleBtn.disabled = false;
      toggleBtn.textContent =
        'Stop Listening';

      pauseBtn.style.display =
        'inline-block';

      setStatus(
        'Listening...'
      );

      startKeepAlive();

      startRecorder();
    };


    // --------------------------------------------------------
    // WebSocket MESSAGE
    // --------------------------------------------------------

    socket.onmessage = (event) => {

      try {

        const data =
          JSON.parse(event.data);

        console.log(
          'Deepgram message:',
          data
        );

        if (
          data.type === 'Results'
        ) {

          const transcript =
            data.channel
              ?.alternatives
              ?. [0]
              ?.transcript || '';

          if (transcript.trim()) {

            liveTranscriptEl.textContent =
              transcript;

            processTranscript(
              transcript,
              data.is_final === true
            );

          }

        }

      } catch (error) {

        console.error(
          'Deepgram message error:',
          error
        );

      }

    };


    // --------------------------------------------------------
    // WebSocket ERROR
    // --------------------------------------------------------

    socket.onerror = (error) => {

      console.error(
        'Deepgram WebSocket error:',
        error
      );

      setStatus(
        'Deepgram connection error. Check the browser console.'
      );

    };


    // --------------------------------------------------------
    // WebSocket CLOSE
    // --------------------------------------------------------

    socket.onclose = (event) => {

      console.error(
        'Deepgram WebSocket closed:',
        event.code,
        event.reason
      );

      stopKeepAlive();

      if (!stopping) {

        running = false;

        if (recorder) {

          try {
            recorder.stop();
          } catch (e) {}

          recorder = null;
        }

        if (stream) {

          stream
            .getTracks()
            .forEach(track => {

              try {
                track.stop();
              } catch (e) {}

            });

          stream = null;
        }

        toggleBtn.disabled = false;

        toggleBtn.textContent =
          'Start Listening';

        pauseBtn.style.display =
          'none';

        setStatus(
          `Voice engine disconnected (${event.code})` +
          (
            event.reason
              ? `: ${event.reason}`
              : ''
          )
        );

      }

    };


  } catch (error) {

    console.error(
      'Start listening error:',
      error
    );

    running = false;
    stopping = true;

    stopKeepAlive();

    if (stream) {

      stream
        .getTracks()
        .forEach(track => {

          try {
            track.stop();
          } catch (e) {}

        });

      stream = null;
    }

    toggleBtn.disabled = false;

    toggleBtn.textContent =
      'Start Listening';

    pauseBtn.style.display =
      'none';

    setStatus(
      `Error: ${error.message}`
    );

  }

}


// ------------------------------------------------------------
// MEDIA RECORDER
// ------------------------------------------------------------

function startRecorder() {

  if (!stream) {
    throw new Error(
      'No microphone stream available.'
    );
  }

  let mimeType =
    'audio/webm;codecs=opus';

  if (
    !MediaRecorder.isTypeSupported(
      mimeType
    )
  ) {

    mimeType =
      'audio/webm';

  }

  if (
    !MediaRecorder.isTypeSupported(
      mimeType
    )
  ) {

    throw new Error(
      'Your browser does not support the required audio format.'
    );

  }

  recorder =
    new MediaRecorder(
      stream,
      {
        mimeType
      }
    );


  recorder.ondataavailable =
    async (event) => {

      if (
        event.data &&
        event.data.size > 0 &&
        socket &&
        socket.readyState === WebSocket.OPEN &&
        !paused
      ) {

        try {

          const buffer =
            await event.data.arrayBuffer();

          socket.send(buffer);

        } catch (error) {

          console.error(
            'Audio send error:',
            error
          );

        }

      }

    };


  recorder.onerror =
    (event) => {

      console.error(
        'Recorder error:',
        event
      );

    };


  recorder.onstop =
    () => {

      console.log(
        'Recorder stopped.'
      );

    };


  recorder.start(250);

  console.log(
    'Recorder started.'
  );

}


// ------------------------------------------------------------
// PROCESS TRANSCRIPT
// ------------------------------------------------------------

function processTranscript(
  transcript,
  isFinal
) {

  const clean =
    transcript.trim();

  if (!clean) {
    return;
  }

  lastTranscript = clean;

  if (!isFinal) {
    return;
  }

  const words =
    clean
      .split(/\s+/)
      .filter(Boolean);

  const minimum =
    Number(minWordsEl.value) || 1;

  if (
    hideShortEl.checked &&
    words.length < minimum
  ) {

    console.log(
      'Ignoring short sentence:',
      clean
    );

    return;

  }

  if (
    clean.toLowerCase() ===
    lastAnalyzedTranscript.toLowerCase()
  ) {

    return;

  }

  lastAnalyzedTranscript =
    clean;

  analyzeSentence(clean);
}


// ------------------------------------------------------------
// ANALYZE SENTENCE
// ------------------------------------------------------------

async function analyzeSentence(
  sentence
) {

  const item =
    document.createElement('div');

  item.className =
    'item';

  item.innerHTML = `
    <div class="original">
      ${escapeHtml(sentence)}
    </div>

    <div class="small">
      Analyzing...
    </div>
  `;

  resultsEl.prepend(item);


  try {

    const response =
      await fetch(
        WORKER,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            text: sentence,

            mode:
              modeEl.value,

            level:
              levelEl.value,

            targetLanguage:
              langEl.value,

            extras:
              extrasEl.value
          })
        }
      );


    if (!response.ok) {

      throw new Error(
        `Analysis failed: ${response.status}`
      );

    }


    const data =
      await response.json();

    console.log(
      'AI analysis:',
      data
    );


    renderAnalysis(
      item,
      sentence,
      data
    );


  } catch (error) {

    console.error(
      'Analysis error:',
      error
    );

    item.innerHTML = `
      <div class="original">
        ${escapeHtml(sentence)}
      </div>

      <div class="warning">
        Analysis error: ${escapeHtml(error.message)}
      </div>
    `;

  }

}


// ------------------------------------------------------------
// RENDER ANALYSIS
// ------------------------------------------------------------

function renderAnalysis(
  item,
  sentence,
  data
) {

  const corrected =
    data.corrected ||
    data.natural ||
    data.suggestion ||
    '';

  const explanation =
    data.explanation ||
    data.reason ||
    '';

  const translation =
    data.translation ||
    '';

  const alternatives =
    data.alternatives ||
    [];


  let html = `
    <div class="original">
      ${escapeHtml(sentence)}
    </div>
  `;


  if (corrected) {

    html += `
      <div>
        <strong>Suggested:</strong>
        <span class="good">
          ${escapeHtml(corrected)}
        </span>
      </div>
    `;

  }


  if (explanation) {

    html += `
      <div class="analysis">
        <strong>Why:</strong>
        ${escapeHtml(explanation)}
      </div>
    `;

  }


  if (translation) {

    html += `
      <div class="translation">
        <strong>Translation:</strong><br>
        ${escapeHtml(translation)}
      </div>
    `;

  }


  if (
    Array.isArray(alternatives) &&
    alternatives.length
  ) {

    html += `
      <div style="margin-top:10px;">
        <strong>Alternatives:</strong>
        <ul>
          ${alternatives
            .map(
              x =>
                `<li>${escapeHtml(String(x))}</li>`
            )
            .join('')}
        </ul>
      </div>
    `;

  }


  if (
    !corrected &&
    !explanation &&
    !translation &&
    !alternatives.length
  ) {

    html += `
      <div class="small">
        No additional correction needed.
      </div>
    `;

  }


  item.innerHTML =
    html;

}


// ------------------------------------------------------------
// STOP LISTENING
// ------------------------------------------------------------

function stopListening() {

  stopping = true;
  running = false;
  paused = false;

  stopKeepAlive();


  if (recorder) {

    try {
      recorder.stop();
    } catch (e) {}

    recorder = null;

  }


  if (socket) {

    try {

      if (
        socket.readyState ===
        WebSocket.OPEN
      ) {

        socket.send(
          JSON.stringify({
            type: 'CloseStream'
          })
        );

      }

    } catch (e) {}


    try {
      socket.close();
    } catch (e) {}

    socket = null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(track => {

        try {
          track.stop();
        } catch (e) {}

      });

    stream = null;

  }


  toggleBtn.disabled = false;

  toggleBtn.textContent =
    'Start Listening';

  pauseBtn.style.display =
    'none';

  pauseBtn.textContent =
    'Pause';

  setStatus(
    'Voice engine stopped.'
  );

}


// ------------------------------------------------------------
// PAUSE
// ------------------------------------------------------------

function togglePause() {

  if (!running) {
    return;
  }

  paused =
    !paused;

  if (paused) {

    pauseBtn.textContent =
      'Resume';

    setStatus(
      'Paused.'
    );

  } else {

    pauseBtn.textContent =
      'Pause';

    setStatus(
      'Listening...'
    );

  }

}


// ------------------------------------------------------------
// CLEAR
// ------------------------------------------------------------

function clearResults() {

  resultsEl.innerHTML =
    'Your corrections and suggestions will appear here.';

  liveTranscriptEl.textContent =
    'Nothing heard yet.';

  lastTranscript = '';
  lastAnalyzedTranscript = '';

}


// ------------------------------------------------------------
// HTML ESCAPE
// ------------------------------------------------------------

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


// ------------------------------------------------------------
// BUTTON EVENTS
// ------------------------------------------------------------

toggleBtn.addEventListener(
  'click',
  () => {

    if (running) {
      stopListening();
    } else {
      startListening();
    }

  }
);


pauseBtn.addEventListener(
  'click',
  togglePause
);


clearBtn.addEventListener(
  'click',
  clearResults
);


// ------------------------------------------------------------
// CLEANUP
// ------------------------------------------------------------

window.addEventListener(
  'beforeunload',
  () => {

    stopping = true;

    stopKeepAlive();

    if (recorder) {

      try {
        recorder.stop();
      } catch (e) {}

    }

    if (socket) {

      try {
        socket.close();
      } catch (e) {}

    }

    if (stream) {

      stream
        .getTracks()
        .forEach(track => {

          try {
            track.stop();
          } catch (e) {}

        });

    }

  }
);

</script>

</body>
</html>
