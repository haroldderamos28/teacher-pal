<script>


// ============================================================
// CONFIGURATION
// ============================================================

const WORKER =
  'https://blue-base-6bdc.haroldderamos28.workers.dev';


// ============================================================
// DOM
// ============================================================

const toggleBtn =
  document.getElementById('toggleBtn');

const pauseBtn =
  document.getElementById('pauseBtn');

const clearBtn =
  document.getElementById('clearBtn');

const statusEl =
  document.getElementById('status');

const liveTranscriptEl =
  document.getElementById('liveTranscript');

const resultsEl =
  document.getElementById('results');

const liveBadge =
  document.getElementById('liveBadge');

const modeEl =
  document.getElementById('mode');

const levelEl =
  document.getElementById('level');

const langEl =
  document.getElementById('lang');

const minWordsEl =
  document.getElementById('minWords');

const hideShortEl =
  document.getElementById('hideShort');

const extrasEl =
  document.getElementById('extras');


// ============================================================
// STATE
// ============================================================

let socket = null;

let recorder = null;

let stream = null;

let running = false;

let stopping = false;

let paused = false;

let keepAliveTimer = null;

let lastAnalyzedTranscript = '';


// ============================================================
// STATUS
// ============================================================

function setStatus(message) {

  statusEl.textContent =
    message;

}


// ============================================================
// LIVE BADGE
// ============================================================

function setLiveBadge(active) {

  if (active) {

    liveBadge.textContent =
      'LIVE';

    liveBadge.classList.add(
      'active'
    );

  } else {

    liveBadge.textContent =
      'Offline';

    liveBadge.classList.remove(
      'active'
    );

  }

}


// ============================================================
// KEEP ALIVE
// ============================================================

function startKeepAlive() {

  stopKeepAlive();

  keepAliveTimer =
    setInterval(() => {

      if (
        socket &&
        socket.readyState ===
          WebSocket.OPEN
      ) {

        try {

          socket.send(
            JSON.stringify({
              type: 'KeepAlive'
            })
          );

        } catch (error) {

          console.error(
            'KeepAlive error:',
            error
          );

        }

      }

    }, 5000);

}


function stopKeepAlive() {

  if (keepAliveTimer) {

    clearInterval(
      keepAliveTimer
    );

    keepAliveTimer =
      null;

  }

}


// ============================================================
// GET DEEPGRAM TOKEN
// ============================================================

async function getDeepgramToken() {

  const response =
    await fetch(
      `${WORKER}/token`,
      {
        method: 'POST'
      }
    );


  if (!response.ok) {

    throw new Error(
      `Token request failed: ${response.status}`
    );

  }


  const data =
    await response.json();


  if (!data.token) {

    throw new Error(
      'No Deepgram token received.'
    );

  }


  return data.token;

}


// ============================================================
// START LISTENING
// ============================================================

async function startListening() {

  if (running) {
    return;
  }


  stopping =
    false;

  paused =
    false;


  try {

    setStatus(
      'Connecting to voice engine...'
    );


    toggleBtn.disabled =
      true;


    // --------------------------------------------------------
    // Microphone
    // --------------------------------------------------------

    stream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          echoCancellation:
            true,

          noiseSuppression:
            true,

          autoGainControl:
            true

        }

      });


    // --------------------------------------------------------
    // Deepgram token
    // --------------------------------------------------------

    const token =
      await getDeepgramToken();


    // --------------------------------------------------------
    // Language
    // --------------------------------------------------------

    const targetLang =
      langEl.value;


    // --------------------------------------------------------
    // Deepgram WebSocket
    // --------------------------------------------------------

    const deepgramUrl =
      'wss://api.deepgram.com/v1/listen' +
      '?model=nova-3' +
      `&language=${encodeURIComponent(targetLang)}` +
      '&smart_format=true' +
      '&interim_results=true' +
      '&utterance_end_ms=1000';


    socket =
      new WebSocket(
        deepgramUrl,
        [
          'bearer',
          token
        ]
      );


    // --------------------------------------------------------
    // OPEN
    // --------------------------------------------------------

    socket.onopen =
      () => {

        console.log(
          'Deepgram connected.'
        );


        running =
          true;


        stopping =
          false;


        toggleBtn.disabled =
          false;


        toggleBtn.textContent =
          'Stop Listening';


        pauseBtn.style.display =
          'inline-block';


        setStatus(
          'Listening...'
        );


        setLiveBadge(
          true
        );


        startKeepAlive();


        startRecorder();

      };


    // --------------------------------------------------------
    // MESSAGE
    // --------------------------------------------------------

    socket.onmessage =
      (event) => {

        try {

          const data =
            JSON.parse(
              event.data
            );


          if (
            data.type ===
            'Results'
          ) {

            const transcript =
              data.channel
                ?.alternatives
                ?. [0]
                ?.transcript ||
              '';


            if (
              transcript.trim()
            ) {

              liveTranscriptEl.textContent =
                transcript;


              processTranscript(
                transcript,
                data.is_final ===
                  true
              );

            }

          }

        } catch (error) {

          console.error(
            'Deepgram message error:',
            error
          );

        }

      };


    // --------------------------------------------------------
    // ERROR
    // --------------------------------------------------------

    socket.onerror =
      (error) => {

        console.error(
          'Deepgram error:',
          error
        );


        setStatus(
          'Deepgram connection error.'
        );

      };


    // --------------------------------------------------------
    // CLOSE
    // --------------------------------------------------------

    socket.onclose =
      (event) => {

        console.error(
          'Deepgram closed:',
          event.code,
          event.reason
        );


        stopKeepAlive();


        setLiveBadge(
          false
        );


        if (!stopping) {

          running =
            false;


          if (recorder) {

            try {
              recorder.stop();
            } catch (e) {}

            recorder =
              null;

          }


          if (stream) {

            stream
              .getTracks()
              .forEach(
                track => {

                  try {
                    track.stop();
                  } catch (e) {}

                }
              );

            stream =
              null;

          }


          toggleBtn.disabled =
            false;


          toggleBtn.textContent =
            'Start Listening';


          pauseBtn.style.display =
            'none';


          setStatus(
            `Voice engine disconnected (${event.code})` +
            (
              event.reason
                ? `: ${event.reason}`
                : ''
            )
          );

        }

      };


  } catch (error) {

    console.error(
      'Start error:',
      error
    );


    running =
      false;

    stopping =
      true;


    stopKeepAlive();


    if (stream) {

      stream
        .getTracks()
        .forEach(
          track => {

            try {
              track.stop();
            } catch (e) {}

          }
        );

      stream =
        null;

    }


    toggleBtn.disabled =
      false;


    toggleBtn.textContent =
      'Start Listening';


    pauseBtn.style.display =
      'none';


    setLiveBadge(
      false
    );


    setStatus(
      `Error: ${error.message}`
    );

  }

}


// ============================================================
// RECORDER
// ============================================================

function startRecorder() {

  if (!stream) {

    throw new Error(
      'No microphone stream.'
    );

  }


  let mimeType =
    'audio/webm;codecs=opus';


  if (
    !MediaRecorder.isTypeSupported(
      mimeType
    )
  ) {

    mimeType =
      'audio/webm';

  }


  recorder =
    new MediaRecorder(
      stream,
      {
        mimeType
      }
    );


  recorder.ondataavailable =
    async (event) => {

      if (
        event.data &&
        event.data.size > 0 &&
        socket &&
        socket.readyState ===
          WebSocket.OPEN &&
        !paused
      ) {

        try {

          const buffer =
            await event.data.arrayBuffer();


          socket.send(
            buffer
          );

        } catch (error) {

          console.error(
            'Audio send error:',
            error
          );

        }

      }

    };


  recorder.start(
    250
  );

}


// ============================================================
// PROCESS TRANSCRIPT
// ============================================================

function processTranscript(
  transcript,
  isFinal
) {

  const clean =
    transcript.trim();


  if (!clean) {
    return;
  }


  if (!isFinal) {
    return;
  }


  const words =
    clean
      .split(/\s+/)
      .filter(Boolean);


  const minimum =
    Number(
      minWordsEl.value
    ) || 1;


  if (
    hideShortEl.checked &&
    words.length < minimum
  ) {

    return;

  }


  if (
    clean.toLowerCase() ===
    lastAnalyzedTranscript.toLowerCase()
  ) {

    return;

  }


  lastAnalyzedTranscript =
    clean;


  analyzeSentence(
    clean
  );

}


// ============================================================
// ANALYZE
// ============================================================

async function analyzeSentence(
  sentence
) {

  const item =
    document.createElement(
      'div'
    );


  item.className =
    'correction-item';


  item.innerHTML = `

    <div class="original-label">
      Student said
    </div>

    <div class="original-text">
      ${escapeHtml(sentence)}
    </div>

    <div class="analyzing">
      Analyzing...
    </div>

  `;


  resultsEl.prepend(
    item
  );


  try {

    const response =
      await fetch(
        WORKER,
        {

          method:
            'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

              text:
                sentence,

              mode:
                modeEl.value,

              level:
                levelEl.value,

              targetLanguage:
                langEl.value,

              extras:
                extrasEl.value

            })

        }
      );


    if (!response.ok) {

      let errorDetails =
        `Analysis failed: ${response.status}`;


      try {

        const errorData =
          await response.json();


        if (
          errorData.details
        ) {

          errorDetails +=
            ` — ${errorData.details}`;

        }

      } catch (e) {}


      throw new Error(
        errorDetails
      );

    }


    const data =
      await response.json();


    renderAnalysis(
      item,
      sentence,
      data
    );


  } catch (error) {

    console.error(
      'Analysis error:',
      error
    );


    item.innerHTML = `

      <div class="original-label">
        Student said
      </div>

      <div class="original-text">
        ${escapeHtml(sentence)}
      </div>

      <div class="error">
        ${escapeHtml(error.message)}
      </div>

    `;

  }

}


// ============================================================
// RENDER CORRECTION
// ============================================================

function renderAnalysis(
  item,
  sentence,
  data
) {

  const corrected =
    data.corrected ||
    '';


  const explanation =
    data.explanation ||
    '';


  const translation =
    data.translation ||
    '';


  const alternatives =
    Array.isArray(
      data.alternatives
    )
      ? data.alternatives
      : [];


  let html = `

    <div class="original-label">
      Student said
    </div>

    <div class="original-text">
      ${escapeHtml(sentence)}
    </div>

  `;


  if (corrected) {

    html += `

      <div class="suggestion">

        <div class="suggestion-label">
          Suggested
        </div>

        ${escapeHtml(
          corrected
        )}

      </div>

    `;

  }


  if (explanation) {

    html += `

      <div class="why">

        <div class="why-label">
          Why
        </div>

        ${escapeHtml(
          explanation
        )}

      </div>

    `;

  }


  if (translation) {

    html += `

      <div class="translation">

        <div class="translation-label">
          Translation
        </div>

        ${escapeHtml(
          translation
        )}

      </div>

    `;

  }


  if (
    alternatives.length
  ) {

    html += `

      <div>

        <div class="alternative-label">
          Alternatives
        </div>

        <ul class="alternatives">

          ${
            alternatives
              .map(
                alternative =>
                  `<li>${escapeHtml(
                    alternative
                  )}</li>`
              )
              .join('')
          }

        </ul>

      </div>

    `;

  }


  item.innerHTML =
    html;

}


// ============================================================
// STOP
// ============================================================

function stopListening() {

  stopping =
    true;

  running =
    false;

  paused =
    false;


  stopKeepAlive();


  if (recorder) {

    try {
      recorder.stop();
    } catch (e) {}

    recorder =
      null;

  }


  if (socket) {

    try {

      if (
        socket.readyState ===
        WebSocket.OPEN
      ) {

        socket.send(
          JSON.stringify({
            type:
              'CloseStream'
          })
        );

      }

    } catch (e) {}


    try {
      socket.close();
    } catch (e) {}


    socket =
      null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => {

          try {
            track.stop();
          } catch (e) {}

        }
      );


    stream =
      null;

  }


  toggleBtn.disabled =
    false;


  toggleBtn.textContent =
    'Start Listening';


  pauseBtn.style.display =
    'none';


  setLiveBadge(
    false
  );


  setStatus(
    'Voice engine stopped.'
  );

}


// ============================================================
// PAUSE
// ============================================================

function togglePause() {

  if (!running) {
    return;
  }


  paused =
    !paused;


  if (paused) {

    pauseBtn.textContent =
      'Resume';


    setStatus(
      'Paused.'
    );

  } else {

    pauseBtn.textContent =
      'Pause';


    setStatus(
      'Listening...'
    );

  }

}


// ============================================================

function clearResults() {

  resultsEl.innerHTML = `

    <div class="small">
      Corrections and suggestions will appear here.
    </div>

  `;


  liveTranscriptEl.innerHTML = `

    <span class="live-placeholder">
      Start listening to hear the student's speech here...
    </span>

  `;


  lastAnalyzedTranscript =
    '';

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}

toggleBtn.addEventListener(

  () => {

    if (running) {

      stopListening();

    } else {

  }
);

);
