<script>
  const WORKER = 'https://workers.dev';

  const \$ = (id) => document.getElementById(id);
  const langEl = ('lang'), modeEl = ('mode'), levelEl = ('level'), extrasEl = ('extras');
  const translateLevelEl = \$('translateLevel');
  const englishControlsEl = ('englishControls'), translateControlsEl = ('translateControls');
  const toggleBtn = \$('toggle'), pauseBtn = ('pauseBtn'), statusEl = ('status'), rowsEl = ('rows'), interimEl = ('interim');

  function isTranslating() { return langEl.value !== 'en'; }

  function updateControlVisibility() {
    const t = isTranslating();
    englishControlsEl.style.display = t ? 'none' : '';
    translateControlsEl.style.display = t ? '' : 'none';
    \$('colLeft').textContent = t ? 'Student said (their language)' : 'Student said';
    \$('colRight').textContent = t ? 'English translation' : 'Feedback';
  }
  langEl.addEventListener('change', updateControlVisibility);

  let socket = null, recorder = null, stream = null, displayStream = null, running = false, paused = false, keepAliveTimer = null;

  function startKeepAlive() {
    clearInterval(keepAliveTimer);
    keepAliveTimer = setInterval(() => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'KeepAlive' }));
      }
    }, 5000);
  }
  function stopKeepAlive() { clearInterval(keepAliveTimer); }

  try {
    modeEl.value = localStorage.getItem('tp_mode') || 'natural';
    levelEl.value = localStorage.getItem('tp_level') || 'intermediate';
    extrasEl.checked = localStorage.getItem('tp_extras') === '1';
  } catch (e) {}
  modeEl.addEventListener('change', () => { try { localStorage.setItem('tp_mode', modeEl.value); } catch (e) {} });
  levelEl.addEventListener('change', () => { try { localStorage.setItem('tp_level', levelEl.value); } catch (e) {} });
  extrasEl.addEventListener('change', () => { try { localStorage.setItem('tp_extras', extrasEl.checked ? '1' : '0'); } catch (e) {} });

  toggleBtn.addEventListener('click', async () => {
    if (running) {
      stopListening();
      return;
    }

    statusEl.textContent = 'Obtaining access token...';
    try {
      const tokenRes = await fetch(`${WORKER}/token`, { method: 'POST' });
      const tokenData = await tokenRes.json();
      if (tokenData.error) throw new Error(tokenData.error);

      statusEl.textContent = 'Connecting to voice engine...';
      const targetLang = langEl.value;

      socket = new WebSocket(`wss://://deepgram.com{targetLang}&smart_formatting=true&interim_results=true&utterance_end_ms=1000`, [
        'token',
        tokenData.token,
      ]);

      socket.onopen = async () => {
        statusEl.textContent = 'Voice engine active. Accessing microphone...';
        startKeepAlive();

        try {
          const audioSource = \$('source').value;
          if (audioSource === 'mic') {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          } else {
            displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            const audioTracks = displayStream.getAudioTracks();
            if (audioTracks.length === 0) throw new Error("No system audio selected.");
            stream = new MediaStream(audioTracks);
          }

          recorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
          recorder.ondataavailable = (e) => {
            if (e.data.size > 0 && socket && socket.readyState === WebSocket.OPEN && !paused) {
              socket.send(e.data);
            }
          };
          recorder.start(250);

          running = true;
          toggleBtn.textContent = 'Stop Listening';
          pauseBtn.style.display = '';
          statusEl.textContent = 'Listening actively...';
        } catch (err) {
          statusEl.textContent = `Audio Error: ${err.message}`;
          stopListening();
        }
      };

      socket.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);
        // FIX APPLIED HERE:
        if (!data.channel?.alternatives) return;

        const transcript = data.channel.alternatives[0]?.transcript || '';

        if (data.is_final) {
          interimEl.textContent = '';
          if (transcript.trim().length > 0) {
            appendRow(transcript.trim());
          }
        } else {
          interimEl.textContent = transcript;
        }
      };

      socket.onclose = (e) => {
        console.log("Connection closed with code:", e.code);
        statusEl.textContent = `Connection closed (code ${e.code}).`;
        stopListening();
      };

      socket.onerror = (err) => {
        statusEl.textContent = 'Voice network error occurred.';
        console.error(err);
      };

    } catch (err) {
      statusEl.textContent = `Connection failed: ${err.message}`;
    }
  });

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    statusEl.textContent = paused ? 'Monitoring paused.' : 'Listening actively...';
  });

  function stopListening() {
    running = false;
    paused = false;
    toggleBtn.textContent = 'Start Listening';
    pauseBtn.style.display = 'none';
    pauseBtn.textContent = 'Pause';
    
    stopKeepAlive();
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    if (stream) stream.getTracks().forEach(track => track.stop());
    if (displayStream) displayStream.getTracks().forEach(track => track.stop());
    if (socket) socket.close();
    
    recorder = null;
    stream = null;
    displayStream = null;
    socket = null;
  }

  async function appendRow(studentSaidText) {
    const minWordsLimit = parseInt(\$('minWords').value, 10);
    const wordCount = studentSaidText.split(/\s+/).filter(Boolean).length;

    const row = document.createElement('div');
    row.className = 'row';

    const leftCol = document.createElement('div');
    leftCol.textContent = studentSaidText;

    const rightCol = document.createElement('div');
    rightCol.className = 'fb';
    rightCol.innerHTML = '<span class="muted">Analyzing...</span>';

    row.appendChild(leftCol);
    row.appendChild(rightCol);
    rowsEl.insertBefore(row, rowsEl.firstChild);

    if (!isTranslating() && wordCount < minWordsLimit) {
      rightCol.innerHTML = \$('hideShort').checked ? '' : '<span class="ok">✓ Short phrase</span>';
      return;
    }

    try {
      const payload = {
        text: studentSaidText,
        level: isTranslating() ? translateLevelEl.value : levelEl.value,
        mode: modeEl.value,
        extras: extrasEl.checked,
        translate: isTranslating(),
        lang: langEl.value
      };

      const res = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      const evalData = await res.json();
      rightCol.innerHTML = '';

      if (evalData.error) {
        rightCol.innerHTML = `<span class="err">Error: ${evalData.error}</span>`;
        return;
      }

      if (isTranslating()) {
        if (evalData.translation) {
          rightCol.innerHTML += `<div class="trn"><strong>Translation:</strong> ${evalData.translation}</div>`;
        }
        if (evalData.suggestion) {
          rightCol.innerHTML += `<div class="sug"><strong>Practice target:</strong> "${evalData.suggestion}"</div>`;
        }
      } else {
        if (evalData.correction && evalData.correction.toLowerCase() !== studentSaidText.toLowerCase()) {
          rightCol.innerHTML += `<div class="fix"><strong>Fix:</strong> ${evalData.correction}</div>`;
        }
        if (evalData.natural) {
          rightCol.innerHTML += `<div class="nat"><strong>${modeEl.value.toUpperCase()}:</strong> ${evalData.natural}</div>`;
        }
        if (evalData.explanation) {
          rightCol.innerHTML += `<div class="tip"><strong>Grammar Note:</strong> ${evalData.explanation}</div>`;
        }
        if (evalData.followup) {
          rightCol.innerHTML += `<div class="ask"><strong>Next Question:</strong> ${evalData.followup}</div>`;
        }
        if (evalData.vocabulary) {
          rightCol.innerHTML += `<div class="tip"><strong>Upgrade word:</strong> ${evalData.vocabulary}</div>`;
        }
        if (evalData.alternatives && evalData.alternatives.length > 0) {
          rightCol.innerHTML += `<div class="muted"><strong>Variants:</strong> ${evalData.alternatives.join(' | ')}</div>`;
        }
        if (rightCol.innerHTML === '') {
          rightCol.innerHTML = '<span class="ok">✓ Grammatically accurate</span>';
        }
      }
    } catch (e) {
      rightCol.innerHTML = `<span class="err">Failed evaluating transcript: ${e.message}</span>`;
    }
  }
</script>
